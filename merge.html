<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#56636F">
<title>ROBOT-DOT-COM 로봇닷컴 : 합치기 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Sunflower:wght@700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #56636F;
    --fg: #F2F5F7;
    --panel: #48535E;
    --cell: #4A5662;
    --me: #1FA8E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }

  #hud { flex: none; text-align: center; padding: 8px 12px 4px; width: 100%; }
  #title { font-family: 'Rye', serif; font-size: 26px; letter-spacing: 1px; line-height: 1.1; }
  #subtitle { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; opacity: .85; margin-top: 2px; }
  #stats { display: flex; justify-content: center; gap: 6px; margin-top: 8px; font-size: 14px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 4px 9px; display: flex; gap: 6px; align-items: baseline; }
  .stat b { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; }
  .stat.cash b { color: #FFE27A; }

  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
  #board { position: relative; background: #3E4852; border-radius: 14px; box-shadow: 0 0 0 4px #2E363E, 0 10px 24px rgba(0,0,0,.35); }
  .slot { position: absolute; background: var(--cell); border-radius: 10px; }

  .tile {
    position: absolute; border-radius: 10px; overflow: hidden;
    transition: translate .12s ease-in-out;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  }
  .tile .art { position: absolute; left: 14%; top: 4%; width: 72%; height: 72%; }
  .tile .stg { position: relative; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 12px; color: #1E252B; background: rgba(255,255,255,.7); border-radius: 6px; padding: 0 5px; margin-bottom: 3px; line-height: 1.35; white-space: nowrap; }
  .tile.new { animation: appear .18s ease-out; }
  .tile.merged { animation: merged .22s ease-out; }
  .tile.sel { box-shadow: 0 0 0 3px #fff, 0 0 14px 3px rgba(255,226,122,.8); z-index: 3; }
  @keyframes appear { from { scale: .2; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes merged { 0% { scale: 1; } 50% { scale: 1.2; } 100% { scale: 1; } }

  /* 단계별 바탕색 : 위로 갈수록 따뜻하고 화려하게 */
  .s0 { background: #C9D3DB; }
  .s1 { background: #A8E0F0; }
  .s2 { background: #8FE3C0; }
  .s3 { background: #FFD27A; }
  .s4 { background: #FF9F7A; }
  .s5 { background: linear-gradient(135deg, #FF8AD8, #B58CFF 50%, #6FD3FF); }
  .s5 .stg { background: #fff; }

  /* Robot Rush와 같은 들썩임 */
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .art.bob { transform-origin: 50% 85%; animation: artBob 1s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .art.bob img.b { display: none; }
  .art.bob.swap img.b { display: block; }
  .art.bob.swap img { animation: artA 1s steps(1, end) infinite; animation-delay: var(--d, 0s); }
  .art.bob.swap img.b { animation-name: artB; }
  @keyframes artA { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes artB { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes artBob { 0%, 100% { rotate: -14deg; translate: 0 0; } 25% { rotate: 0deg; translate: 0 -18%; } 50% { rotate: 14deg; translate: 0 0; } 75% { rotate: 0deg; translate: 0 -18%; } }

  #hint { font-size: 13px; opacity: .8; text-align: center; padding: 0 16px; }
  #legendTypes { display: flex; gap: 10px; justify-content: center; font-size: 12px; }
  #legendTypes span { display: inline-flex; align-items: center; gap: 3px; }
  #legendTypes img { width: 22px; height: 22px; }

  #actions { flex: none; display: flex; gap: 6px; padding: 6px 10px 10px; width: 100%; max-width: 390px; }
  #actions button {
    flex: 1; height: 50px; border: none; border-radius: 10px; background: var(--panel); color: var(--fg);
    font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px;
  }
  #actions button:active { transform: scale(.96); }

  .float {
    position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%);
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; color: #FFE27A;
    text-shadow: 0 1px 0 #2A2F35, 0 0 4px #2A2F35; animation: floatUp 1.1s ease-out forwards; white-space: nowrap;
  }
  @keyframes floatUp { to { transform: translate(-50%, -60px); opacity: 0; } }

  #banner {
    position: fixed; left: 50%; top: 40%; z-index: 20; pointer-events: none;
    background: rgba(30, 36, 42, .9); border-radius: 12px; padding: 12px 18px;
    font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 18px; text-align: center;
    opacity: 0; transform: translate(-50%, -50%) scale(.5); white-space: nowrap;
  }
  #banner.show { animation: banner 1.8s ease-out; }
  #banner.ipo { background: linear-gradient(135deg, #C2367F, #6A4BD8); }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

  /* 매각 확인 : 회사를 누르면 위에 큰 글씨로 몸값 */
  #sellSheet {
    position: fixed; left: 10px; right: 10px; top: calc(6px + env(safe-area-inset-top)); z-index: 15; pointer-events: none;
    max-width: 370px; margin: 0 auto;
    background: #2E363E; border: 3px solid #FFE27A; border-radius: 16px; padding: 12px 14px;
    text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: sheetIn .2s ease-out;
  }
  #sellSheet.hide { display: none; }
  @keyframes sheetIn { from { transform: translateY(-20px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  #sellSheet .who { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 17px; }
  #sellSheet .big { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 52px; line-height: 1.05; color: #FFE27A; margin-top: 4px; }
  #sellSheet .how { font-family: 'IBM Plex Mono', monospace; font-size: 12px; opacity: .75; }
  #sellSheet .tip { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; color: #FFE27A; margin-top: 6px; }

  #over {
    position: fixed; inset: 0; z-index: 30; background: rgba(40, 47, 54, .94);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 20px;
  }
  #over.hide { display: none; }
  #over .big { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 26px; }
  #over .score { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 46px; color: #FFE27A; }
  #over p { font-size: 14px; opacity: .85; line-height: 1.6; }
  #over button { margin-top: 12px; height: 52px; padding: 0 28px; border: none; border-radius: 10px; background: var(--me); color: #10222C; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 17px; }
</style>
</head>
<body>

<div id="hud">
  <div id="title">★ROBOT-DOT-COM★</div>
  <div id="subtitle">로봇닷컴 : 합치기 시제품</div>
  <div id="stats">
    <div class="stat"><span>턴</span><b id="sTurn">0</b></div>
    <div class="stat cash"><span>지갑</span><b id="sCash">0</b></div>
    <div class="stat"><span>판 몸값</span><b id="sBoard">0</b></div>
  </div>
</div>

<div id="main">
  <div id="board"></div>
  <div id="legendTypes"></div>
  <div id="hint">밀어서 같은 로봇·같은 단계끼리 합병. 회사를 누르면 매각.</div>
</div>

<div id="actions">
  <button id="bNew">새 판</button>
</div>

<div id="banner"></div>

<div id="sellSheet" class="hide">
  <div class="who" id="shWho"></div>
  <div class="big" id="shCost"></div>
  <div class="how" id="shHow"></div>
  <div class="tip">같은 회사를 한 번 더 누르면 매각</div>
</div>

<div id="over" class="hide">
  <div class="big" id="overTitle"></div>
  <div class="score" id="overScore"></div>
  <p id="overText"></p>
  <button id="bRestart">다시 창업</button>
</div>

<script>
// 시제품 수치표 (확정되면 config.js로 옮김)
const M = {
  size: 5,                 // 판 5 × 5
  turns: 100,              // 판 길이
  typesPerGame: 3,         // 한 판에 나오는 로봇 종류 수 (5종 중 무작위)
  seedChance: 0.1,         // 새 회사가 시드 단계로 나올 확률
  // 단계 : 같은 로봇·같은 단계 둘이 합쳐지면 한 단계 위. 유니콘 둘이 합쳐지면 상장(엑싯).
  stages: [
    { name: '창업',    value: 10 },
    { name: '시드',    value: 25 },
    { name: '시리즈A', value: 60 },
    { name: '시리즈B', value: 150 },
    { name: '시리즈C', value: 400 },
    { name: '유니콘',  value: 1000 }
  ],
  ipoValue: 3000,          // 상장 평가액 (× 유형 등급)
  boardCountAtEnd: 0.5,    // 판이 끝날 때 남은 회사 몸값은 이 비율만 점수로 (엑싯해야 제값)
  types: [
    { key: 'arm',   name: '협동로봇',   tile: 'robot-cobot',    grade: 1.0 },
    { key: 'legs',  name: '4족로봇',    tile: 'robot-quad',     grade: 1.3 },
    { key: 'hum',   name: '휴머노이드', tile: 'tile-hum',       grade: 2.0 },
    { key: 'wheel', name: '서비스로봇', tile: 'robot-delivery', grade: 0.7 },
    { key: 'tool',  name: '부품·SW',    tile: 'tile-tool',      grade: 1.6 }
  ]
};

(() => {
  const N = M.size;
  const $ = id => document.getElementById(id);
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const boardEl = $('board');
  const TOP = M.stages.length - 1;

  const S = { grid: [], cash: 0, turn: 0, types: [], over: false, sel: null, nextId: 1, exits: 0, ipos: 0 };

  // 판 크기 : 폭 390 안, 남은 높이 안
  let CELL = 68, GAP = 6;
  function layout() {
    const w = Math.min(window.innerWidth, 390) - 28;
    const h = $('main').clientHeight - 80;
    const side = Math.min(w, h, 380);
    GAP = Math.round(side * 0.02);
    CELL = (side - GAP * (N + 1)) / N;
    boardEl.style.width = boardEl.style.height = side + 'px';
  }
  const pos = (r, c) => [GAP + c * (CELL + GAP), GAP + r * (CELL + GAP)];

  const value = t => Math.round(M.stages[t.stage].value * t.type.grade);

  function artHTML(tile) {
    return `<span class="art bob swap" style="--d:-${(Math.random() * 1.1).toFixed(2)}s">` +
      `<img src="assets/${tile}-a.png" alt=""><img class="b" src="assets/${tile}-b.png" alt=""></span>`;
  }

  function makeTileEl(t) {
    const el = document.createElement('div');
    el.className = `tile s${t.stage}`;
    el.style.width = el.style.height = CELL + 'px';
    el.innerHTML = artHTML(t.type.tile) + `<span class="stg">${M.stages[t.stage].name}</span>`;
    el._t = t;
    boardEl.appendChild(el);
    t.el = el;
    place(t);
    return el;
  }

  function place(t) {
    const [x, y] = pos(t.r, t.c);
    t.el.style.translate = `${x}px ${y}px`;
  }

  function restyle(t) {
    t.el.className = `tile s${t.stage}`;
    t.el.querySelector('.stg').textContent = M.stages[t.stage].name;
  }

  function buildBoard() {
    layout();
    boardEl.innerHTML = '';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const s = document.createElement('div');
      s.className = 'slot';
      const [x, y] = pos(r, c);
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.width = s.style.height = CELL + 'px';
      boardEl.appendChild(s);
    }
    for (const row of S.grid) for (const t of row) if (t) { makeTileEl(t); }
  }

  function empties() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!S.grid[r][c]) out.push([r, c]);
    return out;
  }

  function spawn() {
    const e = empties();
    if (!e.length) return null;
    const [r, c] = e[rnd(e.length)];
    const t = { id: S.nextId++, type: S.types[rnd(S.types.length)], stage: Math.random() < M.seedChance ? 1 : 0, r, c };
    S.grid[r][c] = t;
    makeTileEl(t).classList.add('new');
    return t;
  }

  const canMerge = (a, b) => a && b && a.type === b.type && a.stage === b.stage;

  function movesLeft() {
    if (empties().length) return true;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = S.grid[r][c];
      if (c + 1 < N && canMerge(t, S.grid[r][c + 1])) return true;
      if (r + 1 < N && canMerge(t, S.grid[r + 1][c])) return true;
    }
    return false;
  }

  // 밀기 : dr, dc 방향으로 끝까지. 같은 로봇·같은 단계를 만나면 합병(한 번 밀 때 회사당 한 번).
  function move(dr, dc) {
    if (S.over) return;
    closeSell();
    const order = [...Array(N).keys()];
    const rows = dr > 0 ? [...order].reverse() : order;
    const cols = dc > 0 ? [...order].reverse() : order;
    const merged = new Set();
    const removed = [];
    const ups = [];
    let moved = false;

    for (const r of rows) for (const c of cols) {
      const t = S.grid[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
        const o = S.grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (canMerge(t, o) && !merged.has(o.id)) {
          // t가 o로 들어가 합쳐짐
          S.grid[r][c] = null;
          t.r = tr; t.c = tc;
          place(t);
          removed.push(t);
          merged.add(o.id);
          ups.push(o);
          moved = true;
          nr = null;
        }
        break;
      }
      if (nr === null) continue;
      if (nr !== r || nc !== c) {
        S.grid[r][c] = null;
        S.grid[nr][nc] = t;
        t.r = nr; t.c = nc;
        place(t);
        moved = true;
      }
    }
    if (!moved) return;

    S.turn++;
    setTimeout(() => {
      for (const t of removed) t.el.remove();
      for (const o of ups) {
        if (o.stage === TOP) ipo(o);
        else {
          o.stage++;
          restyle(o);
          o.el.classList.remove('merged'); void o.el.offsetWidth; o.el.classList.add('merged');
          if (o.stage >= 3) floatAt(o, M.stages[o.stage].name + '!');
        }
      }
      spawn();
      paintHUD();
      if (S.turn >= M.turns) end('시간 종료');
      else if (!movesLeft()) banner('꽉 막혔다 : 회사를 팔아 자리를 비우자');
    }, 130);
  }

  // 유니콘 둘이 합쳐지면 상장 : 큰돈을 받고 칸이 빔
  function ipo(t) {
    const v = Math.round(M.ipoValue * t.type.grade);
    S.cash += v;
    S.ipos++;
    floatAt(t, '+' + v);
    banner(`${t.type.name} 상장! +${v}`, true);
    S.grid[t.r][t.c] = null;
    t.el.remove();
  }

  // 매각 : 회사를 누르면 몸값, 한 번 더 누르면 팔고 칸이 빔 (한 턴 씀)
  function tapTile(t) {
    if (S.over) return;
    if (S.sel === t) { sell(t); return; }
    if (S.sel) S.sel.el.classList.remove('sel');
    S.sel = t;
    t.el.classList.add('sel');
    $('shWho').textContent = `${t.type.name} ${M.stages[t.stage].name} 매각`;
    $('shCost').textContent = value(t);
    $('shHow').textContent = `${M.stages[t.stage].name} ${M.stages[t.stage].value} × 등급 ${t.type.grade}`;
    const sh = $('sellSheet');
    sh.classList.remove('hide');
    sh.style.animation = 'none'; void sh.offsetWidth; sh.style.animation = '';
  }

  function closeSell() {
    if (S.sel) S.sel.el.classList.remove('sel');
    S.sel = null;
    $('sellSheet').classList.add('hide');
  }

  function sell(t) {
    const v = value(t);
    closeSell();
    S.cash += v;
    S.exits++;
    floatAt(t, '+' + v);
    S.grid[t.r][t.c] = null;
    t.el.style.transition = 'translate .2s, opacity .2s';
    t.el.style.opacity = '0';
    setTimeout(() => t.el.remove(), 200);
    S.turn++;
    spawn();
    paintHUD();
    if (S.turn >= M.turns) end('시간 종료');
  }

  function boardValue() {
    let v = 0;
    for (const row of S.grid) for (const t of row) if (t) v += value(t);
    return v;
  }

  function paintHUD() {
    $('sTurn').textContent = `${S.turn}/${M.turns}`;
    $('sCash').textContent = S.cash;
    $('sBoard').textContent = boardValue();
  }

  function floatAt(t, text) {
    const [x, y] = pos(t.r, t.c);
    const f = document.createElement('div');
    f.className = 'float';
    f.textContent = text;
    f.style.left = (x + CELL / 2) + 'px';
    f.style.top = (y + CELL / 3) + 'px';
    boardEl.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  let bannerT = 0;
  function banner(text, ipoStyle) {
    const b = $('banner');
    b.textContent = text;
    b.classList.toggle('ipo', !!ipoStyle);
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(bannerT);
    bannerT = setTimeout(() => b.classList.remove('show'), 1900);
  }

  function end(why) {
    S.over = true;
    closeSell();
    const bv = Math.round(boardValue() * M.boardCountAtEnd);
    setTimeout(() => {
      $('overTitle').textContent = why;
      $('overScore').textContent = S.cash + bv;
      $('overText').innerHTML = `지갑 ${S.cash} + 남은 회사 ${bv} (몸값의 ${M.boardCountAtEnd * 100}%)<br>매각 ${S.exits}번 · 상장 ${S.ipos}번 · ${S.turn}턴`;
      $('over').classList.remove('hide');
    }, 500);
  }

  function newGame() {
    S.grid = Array.from({ length: N }, () => Array(N).fill(null));
    S.cash = 0; S.turn = 0; S.over = false; S.sel = null; S.exits = 0; S.ipos = 0;
    S.types = shuffle([...M.types]).slice(0, M.typesPerGame);
    $('legendTypes').innerHTML = S.types.map(t => `<span><img src="assets/${t.tile}-a.png" alt="">${t.name} ×${t.grade}</span>`).join('');
    $('over').classList.add('hide');
    closeSell();
    buildBoard();
    spawn(); spawn();
    paintHUD();
  }

  // 밀기 입력 : 손가락 쓸기, 방향키
  let sx = 0, sy = 0, swiping = false;
  document.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiping = true; });
  document.addEventListener('pointerup', e => {
    if (!swiping) return;
    swiping = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) {
      // 짧게 누름 = 탭 : 회사면 매각 창, 아니면 창 닫기
      const el = e.target.closest('.tile');
      if (el && el._t && S.grid[el._t.r][el._t.c] === el._t) tapTile(el._t);
      else if (!e.target.closest('button')) closeSell();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
    else move(dy > 0 ? 1 : -1, 0);
  });
  document.addEventListener('keydown', e => {
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (d) { e.preventDefault(); move(...d); }
  });

  $('bNew').addEventListener('click', () => { if (S.turn === 0 || S.over || confirm('지금 판을 버리고 새로 시작할까?')) newGame(); });
  $('bRestart').addEventListener('click', newGame);
  window.addEventListener('resize', buildBoard);

  newGame();
})();
</script>
</body>
</html>
