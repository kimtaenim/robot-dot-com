<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#56636F">
<title>ROBOT-DOT-COM 로봇닷컴</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Sunflower:wght@700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #56636F; --fg: #F2F5F7; --panel: #48535E; --me: #1FA8E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  #hud { flex: none; text-align: center; padding: 8px 12px 4px; width: 100%; }
  #title { font-family: 'Rye', serif; font-size: 24px; letter-spacing: 1px; line-height: 1.1; }
  #titleRow { position: relative; padding: 0 58px; }
  /* 제목은 소리 버튼 자리를 빼고 한 줄에 들어가게 화면 폭에 맞춰 줄어듦 */
  #titleRow #title { font-size: min(21px, calc((100vw - 150px) / 14.6)); white-space: nowrap; }
  /* 소리 버튼 : Robot Rush·Bosses of Our World와 같은 모양 (sound O 초록 / sound X 빨강) */
  .mute { position: absolute; right: 0; top: 50%; transform: translateY(-50%); border: 0; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .3px; line-height: 1; padding: 4px 5px 4px 7px; border-radius: 12px; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; }
  .mute b { display: inline-block; min-width: 18px; margin-left: 3px; padding: 2px 0; border-radius: 6px; text-align: center; color: #fff; }
  .mute b.on { background: #2E9E4F; }
  .mute b.off { background: #C62828; }
  /* ---------- 손맛 ---------- */
  /* 착지 : 눌렸다 튀어 오름 */
  .ball.land { transform-origin: 50% 100%; animation: land .32s ease-out; }
  @keyframes land { 0% { scale: 1.25 .7; } 40% { scale: .9 1.12; } 70% { scale: 1.04 .97; } 100% { scale: 1 1; } }
  .dust { position: absolute; z-index: 6; pointer-events: none; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.75); transform: translate(-50%, -50%); animation: dust .45s ease-out forwards; }
  @keyframes dust { to { transform: translate(calc(-50% + var(--dx)), calc(-50% - 14px)) scale(2); opacity: 0; } }
  /* 빨려 드는 회사 */
  .ball.suck { transition: translate .12s ease-in, scale .12s ease-in, opacity .12s; scale: .4 .4; opacity: .4; }
  /* 작은 흔들림 (합병마다) */
  #box.nudge { animation: nudge .18s ease-in-out; }
  @keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: 0 3px; } }
  /* 연쇄 번쩍 */
  #boxFlash { position: absolute; inset: 0; z-index: 8; pointer-events: none; background: #fff; opacity: 0; border-radius: 14px; }
  #boxFlash.on { animation: boxFlash .35s ease-out; }
  @keyframes boxFlash { 0% { opacity: .45; } 100% { opacity: 0; } }
  /* 동전 : 지갑으로 날아감 */
  .coin { position: fixed; z-index: 40; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 30%, #FFF6C2, #FFD23F 45%, #C9971C); box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: left .55s cubic-bezier(.5, -0.3, .7, 1), top .55s cubic-bezier(.2, -0.6, .5, 1), opacity .1s .5s; }
  .stat.cash.bump { animation: bump .25s ease-out; }
  @keyframes bump { 50% { scale: 1.18; } }
  /* 꽃가루 */
  .confetti { position: absolute; z-index: 9; top: -12px; width: 8px; height: 12px; pointer-events: none; animation: confetti linear forwards; }
  @keyframes confetti { to { transform: translate(var(--dx), var(--fall)) rotate(var(--rot)); opacity: .2; } }
  #subtitle { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 13px; opacity: .85; margin-top: 2px; }
  #stats { display: flex; justify-content: center; gap: 4px; margin-top: 6px; font-size: 13px; white-space: nowrap; }
  .stat { background: var(--panel); border-radius: 8px; padding: 3px 7px; display: flex; gap: 4px; align-items: center; }
  button.stat { border: none; justify-content: center; padding-top: 5px; line-height: 1; color: var(--fg); font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .stat b { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; }
  .stat.cash b { color: #FFE27A; }
  .stat.cash.red { background: #8E2A24; animation: urgent .6s ease-in-out infinite alternate; }
  .stat.cash.red b { color: #fff; }
  @keyframes urgent { from { opacity: 1; } to { opacity: .6; } }

  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; width: 100%; padding-top: 4px; }
  #box.shake { animation: shake .35s ease-in-out; }
  @keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -5px 2px; } 40% { translate: 5px -2px; } 60% { translate: -4px 1px; } 80% { translate: 3px 0; } }
  /* 도자기 파편 */
  /* 파편 : 위로 솟았다가 떨어지며 도는 조각 */
  .shard { position: absolute; z-index: 7; pointer-events: none; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.3); animation: shard .85s cubic-bezier(.2, .7, .4, 1) forwards; }
  .shard.tri { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  @keyframes shard {
    0% { transform: translate(-50%, -50%) rotate(0) scale(.6); opacity: 1; }
    35% { transform: translate(calc(-50% + var(--dx) * .7), calc(-50% + var(--dy))) rotate(calc(var(--rot) * .4)) scale(1); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 90px)) rotate(var(--rot)) scale(.8); opacity: 0; }
  }
  /* 합쳐지는 자리에서 퍼지는 링 */
  .burst { position: absolute; z-index: 6; pointer-events: none; border-radius: 50%; border: 5px solid var(--bc); transform: translate(-50%, -50%) scale(.3); animation: burst .45s ease-out forwards; }
  @keyframes burst { to { transform: translate(-50%, -50%) scale(1.9); opacity: 0; border-width: 1px; } }
  .ball.flash { animation: flash .3s ease-out; }
  @keyframes flash { 0% { filter: brightness(2.2); scale: 1.18; } 100% { filter: brightness(1); scale: 1; } }
  /* 연쇄 */
  .chain { position: absolute; z-index: 9; pointer-events: none; transform: translate(-50%, -50%); font-family: 'Sunflower', sans-serif; font-weight: 700; color: #FFE27A; -webkit-text-stroke: 1.5px #0C2163; text-shadow: 0 3px 0 #0C2163; white-space: nowrap; animation: chainPop 1s ease-out forwards; }
  @keyframes chainPop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 35% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }

  /* 실제 회사 카드 : Delft 블루 도자기 타일 */
  #card { position: fixed; inset: 0; z-index: 31; background: rgba(12, 22, 48, .72); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #card.hide { display: none; }
  .cardBox { width: 100%; max-width: 340px; background: #FBFCFF; color: #10275F; border-radius: 18px; border: 4px solid #1E3F8F; box-shadow: inset 0 0 0 3px #FBFCFF, inset 0 0 0 5px #6F94D6, 0 14px 30px rgba(0,0,0,.45); padding: 18px 18px 14px; text-align: center; animation: cardIn .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .cardBox .ev { display: inline-block; background: #1E3F8F; color: #fff; border-radius: 999px; padding: 2px 14px; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; }
  .cardBox .pic { width: 74px; height: 74px; margin: 8px auto 2px; position: relative; }
  .cardBox .pic img { width: 100%; height: 100%; object-fit: contain; filter: grayscale(1) sepia(1) saturate(5) hue-rotate(175deg) brightness(.55) contrast(1.6); }
  .cardBox .co { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 22px; }
  .cardBox .en { font-size: 12px; opacity: .65; }
  .cardBox .ti { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px; margin-top: 8px; color: #1E3F8F; }
  .cardBox p { font-size: 14px; line-height: 1.6; margin-top: 6px; text-align: left; word-break: keep-all; }
  .cardBox .yr { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; margin-top: 10px; color: #1E3F8F; }
  .cardBox .foot { display: flex; justify-content: space-between; font-size: 11px; opacity: .6; margin-top: 8px; }

  /* 도감 : Delft 블루 */
  #dex, #dexDetail { position: fixed; inset: 0; z-index: 29; background: #F3F6FC; color: #10275F; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); }
  #dex.hide, #dexDetail.hide { display: none; }
  .dexHead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 3px double #6F94D6; }
  .dexHead .dt { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 20px; }
  .dexHead .ds { font-size: 12px; opacity: .7; }
  .dexHead button { height: 36px; padding: 0 14px; border: 2px solid #1E3F8F; border-radius: 18px; background: #fff; color: #1E3F8F; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; }
  #dexList, #ddCards { flex: 1; overflow-y: auto; padding-top: 6px; touch-action: pan-y; }
  .grp .gh { display: flex; align-items: center; gap: 6px; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px; margin: 10px 0 6px; color: #1E3F8F; }
  .grp .gh img { width: 26px; height: 26px; filter: grayscale(1) sepia(1) saturate(5) hue-rotate(175deg) brightness(.55) contrast(1.6); }
  .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grp .gh { grid-column: 1 / -1; }
  .grp .co { position: relative; text-align: left; background: #fff; border: 2px solid #1E3F8F; border-radius: 10px; padding: 6px 8px; color: #10275F; font: inherit; }
  .grp .co b { display: block; font-family: 'Sunflower', sans-serif; font-size: 14px; }
  .grp .co span { font-size: 11px; opacity: .65; }
  .grp .co i { position: absolute; right: 6px; top: 6px; font-style: normal; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1E3F8F; }
  .grp .co.locked { background: #E3E9F4; border-style: dashed; color: #7A8AAE; }
  .ddTop { padding: 10px 2px; }
  .ddTop .dn { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 24px; }
  .ddTop .de { font-size: 12px; opacity: .65; }
  .ddTop .do { font-size: 14px; margin-top: 6px; line-height: 1.5; word-break: keep-all; }
  .dc { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: #fff; border: 2px solid #1E3F8F; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; color: #10275F; font: inherit; }
  .dc em { font-style: normal; background: #1E3F8F; color: #fff; border-radius: 999px; padding: 1px 8px; font-family: 'Sunflower', sans-serif; font-size: 12px; flex: none; }
  .dc b { flex: 1; font-family: 'Sunflower', sans-serif; font-size: 14px; }
  .dc span { font-family: 'IBM Plex Mono', monospace; font-size: 12px; opacity: .7; }
  .dc.locked { background: #E3E9F4; border-style: dashed; color: #7A8AAE; }
  .dc.locked em { background: #9AA8C6; }

  #box { flex: none; position: relative; background: #3E4852; border-radius: 14px; box-shadow: 0 0 0 4px #2E363E, 0 10px 24px rgba(0,0,0,.35); overflow: hidden; }
  /* 육각 칸 (꼭짓점이 옆) */
  .slot, .ball .face, .ball .rb { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  /* 두꺼운 평면 타일 : 윗면 육각(86%) + 아래로 옆면(두께 14%) */
  .ball { clip-path: polygon(25% 0, 75% 0, 100% 43%, 100% 57%, 75% 100%, 25% 100%, 0 57%, 0 43%); }
  .slot { position: absolute; background: #4A5662; }
  .col { position: absolute; border-radius: 12px; background: rgba(255,255,255,.07); pointer-events: none; display: none; }
  /* 헥사판에서는 고르는 줄 띠를 보이지 않음 */
  .col.on { display: none; }
  .col.full { background: rgba(255, 90, 78, .16); }
  #dropRow { position: absolute; left: 0; right: 0; top: 0; border-bottom: 2px dashed rgba(255,255,255,.15); pointer-events: none; }

  /* 공 = 입체 뱃지 : 빛 받는 볼록면 + 진한 테두리 + 안쪽 흰 링 + 윗부분 광택 + 그림자 */
  .ball {
    position: absolute; left: 0; top: 0; border-radius: 50%; will-change: translate;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.85) 0%, var(--c) 24%, var(--c2) 100%);
    border: 3px solid var(--c3);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -6px 8px rgba(0,0,0,.22), 0 4px 0 var(--c3), 0 6px 8px rgba(0,0,0,.35);
  }
  /* 구르는 면 : 그림·테두리 무늬가 같이 돌고, 이름표·광택은 제자리 */
  .ball .face { position: absolute; inset: 0; border-radius: 50%; }
  /* 도자기 접시 테두리 무늬 */
  .ball .face::before {
    content: ''; position: absolute; inset: 7%; border-radius: 50%;
    border: 2px dotted var(--ink); opacity: .7; pointer-events: none; z-index: 1;
  }
  .ball::after {
    content: ''; position: absolute; left: 16%; top: 7%; width: 46%; height: 26%; border-radius: 50%;
    background: linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,0)); transform: rotate(-24deg); pointer-events: none; z-index: 2;
  }
  /* 로봇 그림 크기 : 단계마다 커짐 (--aw) */
  .ball .face .art { --aw: inherit; }
  .ball .art { position: absolute; z-index: 1; --aw: 70%; width: var(--aw); height: var(--aw); left: calc((100% - var(--aw)) / 2); top: calc((88% - var(--aw)) / 2); }
  /* 단계 숫자 : 같은 그림 + 같은 숫자 = 합쳐짐 */
  .ball .num { position: absolute; z-index: 4; left: 5%; top: 5%; width: 30%; height: 30%; border-radius: 50%; background: #fff; color: var(--c3, #8A6A10); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .st-uni .num { background: #FFE27A; color: #8A5A00; }

  .ball .stg { position: absolute; z-index: 3; left: 50%; bottom: 6%; transform: translateX(-50%); box-shadow: 0 1px 2px rgba(0,0,0,.25); font-family: 'Sunflower', sans-serif; font-weight: 700; color: #1C3577; background: rgba(255,255,255,.9); border-radius: 5px; padding: 0 4px; line-height: 1.3; white-space: nowrap; }
  .ball.held { opacity: .95; transition: translate .08s ease-out; z-index: 5; }
  /* 사각 칸 뱃지 : 공과 같은 광택·테두리, 모서리만 둥근 사각 */
  /* 평면 타일 : 바깥(옆면) = 진한 색, 윗면 = 거의 단색 (위쪽만 살짝 밝게) */
  .ball { border-radius: 0; border: none; transition: translate .13s ease-in; box-shadow: none;
    /* 옆면 : 같은 색 계열의 진한 색, 아래로 갈수록 더 어둡게 */
    background: linear-gradient(180deg, var(--rim, var(--c3)) 55%, color-mix(in srgb, var(--rim, var(--c3)) 70%, #000) 100%); }
  /* 윗면 : 테두리를 밝게 깎은 면(베벨) 안에 단색 면 */
  .ball .face { inset: 0 0 auto 0; height: 86%; border-radius: 0; isolation: isolate; background: var(--bev, color-mix(in srgb, var(--c) 62%, #fff)); }
  .ball .face::before { display: block; content: ''; position: absolute; inset: 6% 4.5% 7%; border: none; border-radius: 0; opacity: 1; z-index: -1;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 88%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 90%, #000) 100%); }
  /* 광택 : 위쪽 비스듬한 반사 */
  .ball .face::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.18) 30%, rgba(255,255,255,0) 31%, rgba(255,255,255,0) 100%); }
  .ball::after { display: none; }
  .st-uni { background: #C8962A; }
  .st-uni .face { background: none; }
  .st-uni .face::before { display: none; }
  .ball .rb { inset: 0 0 auto 0 !important; height: 86%; border-radius: 0; }
  .ball .rb::after { display: none; }
  .ball .num { left: 50%; top: 9%; width: 20%; height: 23%; transform: translateX(-50%); }
  .ball .stg { bottom: 17%; color: var(--tx, #1C3577); }
  .ball .num { color: var(--tx, var(--c3, #8A6A10)); }
  .ball.st-uni .num { color: #8A5A00; }
  .ball.gone { opacity: 0; transition: translate .12s, opacity .12s; }
  .ball.pop { animation: pop .25s ease-out; }
  .ball.pick { animation: pickGlow .55s ease-in-out infinite alternate; }
  .ball.sel { filter: brightness(1.15) drop-shadow(0 0 8px #FFE27A); }
  @keyframes pop { 0% { scale: .7; } 60% { scale: 1.15; } 100% { scale: 1; } }
  @keyframes pickGlow { from { filter: brightness(1); } to { filter: brightness(1.2) drop-shadow(0 0 6px #FF8A80); } }
  /* 기본 색 (토널 셰이드를 못 쓸 때). 실제 색은 로봇 종류 색조 × 단계 명도로 칸마다 정함 */
  .st-found { --c: #FFE45C; --c2: #F5B700; --c3: #B07A00; --ink: #FFFFFF; }
  .st-seed  { --c: #FFB15C; --c2: #F57A1F; --c3: #B04A00; --ink: #FFFFFF; }
  .st-a     { --c: #FF8FB0; --c2: #F0426E; --c3: #A8183F; --ink: #FFFFFF; }
  .st-b     { --c: #B79CFF; --c2: #7B4DF0; --c3: #4A1FA8; --ink: #FFFFFF; }
  .st-c     { --c: #7FE0F0; --c2: #1FA8C8; --c3: #0B6A85; --ink: #FFFFFF; }
  .st-uni   { --c3: #C8962A; --ink: #FFFFFF; background: #C8962A; border-color: #E8B94A; }
  /* 유니콘 : 빨강에서 보라까지 무지개 띠가 흐르고, 별이 반짝임 */
  .ball .rb { position: absolute; inset: 0; border-radius: inherit; z-index: 0; pointer-events: none;
    /* 빨-주-노-초-파-남-보 다음 다시 보라→빨강으로 이어지는 반복 띠(한 바퀴 70px, 대각선).
       가로로 70 / cos(30°) = 80.8px 밀면 정확히 한 바퀴라 끊김 없이 흐름 */
    overflow: hidden; }
  /* 띠는 칸보다 넓은 한 장으로 그려 통째로 밀어서, 칸 경계에서 이음매가 생기지 않음 */
  .ball .rb::before { content: ''; position: absolute; top: 0; bottom: 0; left: -100px; right: 0;
    background: repeating-linear-gradient(120deg, #FF4D4D 0px, #FF9F1C 10px, #FFE14D 20px, #4DD67A 30px, #3FA9F5 40px, #5B5BE8 50px, #A64DF0 60px, #FF4D4D 70px);
    animation: rainbow 2.2s linear infinite; will-change: translate; }
  .ball .rb::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.7), rgba(255,255,255,0) 55%); }
  @keyframes rainbow { from { translate: 0 0; } to { translate: 80.83px 0; } }
  .st-uni { animation: uniGlow 1.2s ease-in-out infinite alternate; }

<script>
// 빌드 번호 : 올릴 때마다 바꾸면 열려 있던 폰도 새 버전으로 새로고침됨
const BUILD_V = '2026.11.02-2';
// 수치표
const M = {
  cols: 4,                 // 세로 줄 수 (헥사, 홀수 줄은 반 칸 아래로 엇갈림, ?c=)

(() => {

  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // 육각 판 : 칸 폭 CELL(=육각 가로), 높이 HH. 줄 간격 SX = 0.75칸, 칸 간격 SY = 높이. 홀수 줄은 SY/2 아래.
  let HH = 48, SX = 42, SY = 50;
  const HG = 3;   // 육각 사이 틈
  function geom() { HH = Math.round(CELL * 0.866); SX = CELL * 0.75 + HG; SY = HH + HG; }
  function layout(fitRows) {
    const w = Math.min(window.innerWidth, 480) - 12;
    const h = $('main').clientHeight - 6;
    const full = Math.floor((w - GAP * 2 - HG * (C - 1)) / (0.75 * (C - 1) + 1));
    const rowsFor = cell => { const sy = cell * 0.866 + HG; return Math.floor((h - GAP * 3 - sy / 2) / sy) - 1; };
    CELL = full;
    while (fitRows && rowsFor(CELL) < 6 && CELL > full * 0.88) CELL--;
    if (fitRows) H = Math.max(5, Math.min(M.rows, rowsFor(CELL)));
    // 정해진 칸 수(H)가 세로에 다 들어가게 칸 크기를 맞춤 (다시 그릴 때도)
    CELL = Math.floor(Math.min(CELL, ((h - GAP * 3) / (H + 1.5) - HG) / 0.866));
    geom();
    BW = GAP * 2 + (C - 1) * SX + CELL;
    boxEl.style.width = BW + 'px';
    boxEl.style.height = GAP * 3 + (H + 1) * SY + SY / 2 + 'px';
    $('dropRow').style.height = (SY + GAP) + 'px';
  }
  // 칸 왼쪽 위 (r = -1 은 들고 있는 줄)
  const px = (c, r) => [GAP + c * SX, GAP * 2 + (r + 1) * SY + (c % 2 ? SY / 2 : 0)];
  // 육각 이웃 6칸 (홀수 줄이 반 칸 아래)
  const NBR = (r, c) => (c % 2
    ? [[r + 1, c], [r, c - 1], [r, c + 1], [r + 1, c - 1], [r + 1, c + 1], [r - 1, c]]
    : [[r + 1, c], [r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c + 1], [r - 1, c]]);
  const mid = (c, r) => { const [x, y] = px(c, r); return [x + CELL / 2, y + HH / 2]; };

  const LV = () => M.levels[Math.min(S.level - 1, M.levels.length - 1)];
  function spawnStage() {
    const w = LV().spawn;
    let x = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < w.length; i++) { x -= w[i]; if (x < 0) return i; }
    return 0;
  }
  const stageCls = stage => 'st-' + S.stages[stage].key;
  // 토널 셰이드 : 로봇 종류의 색조 하나로, 단계가 오를수록 진하게
  // 연한 단계(창업·시드투자)는 거의 흰빛이라 로봇 종류가 안 보임 : 윗면 테두리(베벨)를 그 종류의 진한 색으로, 옆면도 더 진하게
  const lightEdge = (type, L) => L < 70 ? {} : {
    bev: `hsl(${type.hue} ${Math.min(100, 72 * type.sat)}% ${L > 90 ? 55 : 46}%)`,
    rim: `hsl(${type.hue} ${Math.min(100, 60 * type.sat)}% ${L > 90 ? 38 : 32}%)`
  };
  // 단계 글씨·숫자 : 그 로봇 종류의 진한 색 (어느 단계에서도 종류가 보이게)
  const textOf = type => `hsl(${type.hue} ${Math.min(100, 85 * type.sat)}% 32%)`;
  function toneOf(type, stage) {
    const sh = M.shade[S.stages[stage].key];
    if (!sh) return null;
    const [L, Sat] = sh, sat = Sat * type.sat;
    // 그늘(c2)·테두리(c3)는 명도에 비례 : 진한 단계일수록 확실히 어두워짐
    return {
      c: `hsl(${type.hue} ${sat}% ${L}%)`,
      c2: `hsl(${type.hue} ${Math.min(100, sat + 10)}% ${Math.round(L * 0.72)}%)`,
      c3: `hsl(${type.hue} ${Math.min(100, sat + 12)}% ${Math.round(L * 0.45)}%)`,
      rim: `hsl(${type.hue} ${sat}% ${Math.round(L * 0.66)}%)`,   // 육각 테두리 : 너무 진하지 않게
      tx: textOf(type),
      ...lightEdge(type, L)
    };
  }
  function applyTone(el, t) {
    const tn = toneOf(t.type, t.stage);
    for (const k of ['c', 'c2', 'c3', 'rim', 'bev', 'tx']) tn ? el.style.setProperty('--' + k, tn[k]) : el.style.removeProperty('--' + k);
  }
  const valueOf = (stage, type) => Math.round(S.stages[stage].value * type.grade);
  const value = t => valueOf(t.stage, t.type);
  const newTile = () => ({ id: S.nextId++, type: S.types[rnd(S.types.length)], stage: spawnStage() });
  const tiles = () => { const out = []; for (let r = 0; r < H; r++) for (let c = 0; c < C; c++) if (S.grid[r][c]) out.push(S.grid[r][c]); return out; };
  const colFull = c => !!S.grid[0][c];
  // 꽉 찬 줄이라도 맨 위 회사와 같으면 그 위로 떨어뜨려 바로 합병
  const topMerge = c => colFull(c) && S.cur && same(S.grid[0][c], S.cur);
  const canDrop = c => !colFull(c) || topMerge(c);
  const allFull = () => [...Array(C).keys()].every(colFull);
  const same = (a, b) => a && b && a.type === b.type && a.stage === b.stage;

  function artHTML(tile) {
    return `<span class="art bob swap" style="--d:-${(Math.random() * 1.1).toFixed(2)}s">` +
      `<img src="assets/${tile}-a.png" alt=""><img class="b" src="assets/${tile}-b.png" alt=""></span>`;
  }
  // 단계 숫자와 로봇 그림 크기 (단계 이름으로 정해서 어느 레벨에서나 같음)
  const STAGE_NUM = { found: '1', seed: '2', a: '3', b: '4', c: '5', uni: '★' };
  const STAGE_ART = { found: '46%', seed: '55%', a: '63%', b: '70%', c: '76%', uni: '78%' };
  const faceHTML = (tile, key, size) =>
    (key === 'uni' ? '<span class="rb"></span><span class="tw t1">✦</span><span class="tw t2">✦</span><span class="tw t3">✦</span>' : '') +
    `<span class="face" style="--aw:${STAGE_ART[key]}">${artHTML(tile)}</span>` +
    `<span class="num" style="font-size:${Math.max(9, size * 0.2)}px">${STAGE_NUM[key]}</span>` +
    `<span class="stg" style="font-size:${Math.max(9, size * 0.19)}px">${M.stageDefs[key].name}</span>`;
  function tileEl(t) {
    const el = document.createElement('div');
    el.className = `ball ${stageCls(t.stage)}`;
    applyTone(el, t);
    el.style.width = CELL + 'px'; el.style.height = HH + 'px';
    el.innerHTML = faceHTML(t.type.tile, S.stages[t.stage].key, CELL);
    el._t = t;
    boxEl.appendChild(el);
    t.el = el;
    return el;
  }
  function restyle(t) {
    t.el.className = `ball ${stageCls(t.stage)}`;
    applyTone(t.el, t);
    const key = S.stages[t.stage].key;
    if (key === 'uni' && !t.el.querySelector('.rb')) t.el.insertAdjacentHTML('afterbegin', '<span class="rb"></span><span class="tw t1">✦</span><span class="tw t2">✦</span><span class="tw t3">✦</span>');
    t.el.querySelector('.stg').textContent = S.stages[t.stage].name;
    t.el.querySelector('.num').textContent = STAGE_NUM[key];
    t.el.querySelector('.face').style.setProperty('--aw', STAGE_ART[key]);
  }
  const place = t => { const [x, y] = px(t.c, t.r); t.el.style.translate = `${x}px ${y}px`; };

  let colEls = [];
  function buildBoard() {
    layout();
    for (const el of boxEl.querySelectorAll('.slot, .col, .ball')) el.remove();
    colEls = [];
    for (let c = 0; c < C; c++) {
      const ce = document.createElement('div');
      ce.className = 'col';
      const [x] = px(c, 0);
      ce.style.left = (x + CELL * 0.12) + 'px'; ce.style.width = (CELL * 0.76) + 'px';
      ce.style.top = GAP + 'px'; ce.style.bottom = GAP + 'px';
      boxEl.appendChild(ce); colEls.push(ce);
      for (let r = 0; r < H; r++) {
        const s = document.createElement('div');
        s.className = 'slot';
        const [sx, sy] = px(c, r);
        s.style.left = sx + 'px'; s.style.top = sy + 'px'; s.style.width = CELL + 'px'; s.style.height = HH + 'px';
        boxEl.appendChild(s);
      }
    }
    for (const t of tiles()) { tileEl(t); place(t); }
    if (S.cur) { tileEl(S.cur).classList.add('held'); aim(S.col); }
  }

  // 들고 있는 회사를 c번 줄 위로
  function aim(c) {
    S.col = Math.max(0, Math.min(C - 1, c));
    if (SIM) return;
    if (S.cur && S.cur.el) { const [x] = px(S.col, -1); S.cur.el.style.translate = `${x}px ${GAP * 2}px`; }   // 들고 있는 줄은 엇갈리지 않음
    colEls.forEach((ce, i) => { ce.classList.toggle('on', i === S.col && !S.busy); ce.classList.toggle('full', i === S.col && !canDrop(i)); });
  }

  function spawn() {
    S.cur = S.next || newTile();
    S.next = newTile();
    if (SIM) return;
    tileEl(S.cur).classList.add('held');
    aim(S.col);
    paintNext();
  }
  function paintNext() {
    const nb = $('nextBall');
    if (!nb) return;   // 다음 보기는 없앰
    nb.innerHTML = '';
    const mini = document.createElement('div');
    mini.className = `ball ${stageCls(S.next.stage)}`;
    applyTone(mini, S.next);
    mini.style.cssText = 'position:relative;display:inline-block;width:20px;height:20px;border-width:2px;vertical-align:middle;box-shadow:none;transition:none';
    mini.innerHTML = artHTML(S.next.type.tile);
    nb.appendChild(mini);
  }

  // 떨어뜨리기 : 그 줄 맨 아래 빈칸까지 → 합병을 끝까지 풂
  async function dropAt(c) {
    if (S.busy || S.over || S.crisis || S.paused || !S.cur) return;
    if (!canDrop(c)) { banner('이 줄은 꽉 찼어요'); return; }
    S.busy = true;
    const t = S.cur;
    S.cur = null;
    // 꽉 찬 줄 : 맨 위 회사를 흡수하며 그 자리로 (topGone)
    const topGone = colFull(c) ? S.grid[0][c] : null;
    let r = H - 1;
    while (r > 0 && S.grid[r][c] && !topGone) r--;
    if (topGone) r = 0;
    t.c = c; t.r = r;
    S.grid[r][c] = t;
    const cost = Math.round(value(t) * M.dropRate);   // 창업 비용
    S.cash -= cost;
    S.minCash = Math.min(S.minCash, S.cash);
    S.turn++;
    S.chain = 0;
    if (!SIM) {
      t.el.classList.remove('held');
      t.el.style.transitionDuration = (0.05 * (r + 1) + 0.08) + 's';
      place(t);
      sfx.drop();
      aim(S.col);
      const [mx, my] = mid(c, r);
      floatAt(mx, my, '-' + cost, true);
      paintHUD();
      aim(S.col);
      await sleep(50 * (r + 1) + 90);
      t.el.style.transitionDuration = '';
      // 착지 : 눌렸다 튀어 오르고, 먼지, 툭, 짧은 진동
      t.el.classList.remove('land'); void t.el.offsetWidth; t.el.classList.add('land');
      dust(mx, my + HH / 2 - 4);
      sfx.land(); buzz(10); nudge();
    }
    await resolve([t], topGone);
    S.busy = false;
    if (S.over) return;
    spawn();
    await settle();
  }

  // 닿은 같은 회사끼리 합병 → 빈자리로 위 회사들이 내려옴 → 또 합병 (연쇄, 수입이 연쇄 횟수만큼 배로)
  // 합병 : 움직인 회사(t)가 닿은 같은 회사를 전부 한꺼번에 흡수하고 제자리에 남음.
  //   하나와 닿으면 한 단계, 둘이면 두 단계, 셋이면 세 단계 위로. 위 칸이 내려와 또 닿으면 연쇄(수입 배수).
  //   extra : 꽉 찬 줄 위로 떨어뜨렸을 때 흡수되는 맨 위 회사 (이미 자리를 내줌)
  // 이 합병으로 유니콘이 된 t가 (빈자리로 내려온 뒤) 같은 유니콘과 닿는지 미리 봄 = 곧 상장
  function ipoNext(t, stage) {
    const g = S.grid.map(row => row.slice());
    let tr = t.r;
    for (let c = 0; c < C; c++) {
      let w = H - 1;
      for (let r = H - 1; r >= 0; r--) {
        const o = g[r][c];
        if (!o) continue;
        if (r !== w) { g[w][c] = o; g[r][c] = null; }
        if (o === t) tr = w;
        w--;
      }
    }
    return NBR(tr, t.c).some(([r, c]) => r >= 0 && r < H && c >= 0 && c < C && g[r][c] && g[r][c] !== t && g[r][c].type === t.type && g[r][c].stage === stage);
  }
  async function resolve(active, extra) {
    while (active.length) {
      const t = active.shift();
      if (!t || !S.grid[t.r] || S.grid[t.r][t.c] !== t) continue;
      const gone = NBR(t.r, t.c)
        .filter(([r, c]) => r >= 0 && r < H && c >= 0 && c < C).map(([r, c]) => S.grid[r][c]).filter(o => same(t, o));
      if (extra) { gone.push(extra); extra = null; }
      if (!gone.length) continue;
      for (const g of gone) if (S.grid[g.r][g.c] === g) S.grid[g.r][g.c] = null;
      // 상장은 유니콘 + 유니콘일 때만 : 여럿이 한꺼번에 합쳐져도 유니콘에서 멈춤 (유니콘 둘이 만나는 장면이 늘 보이게)
      const stage = Math.min(t.stage === S.top - 1 ? S.top : S.top - 1, t.stage + gone.length);
      if (stage === S.top) {
        S.grid[t.r][t.c] = null;
        if (!SIM) await ipoMerge(t, gone);
        await ipo(t, t);
        return;
      }
      // 이 합병으로 유니콘이 되고 바로 옆에 같은 유니콘이 있으면 = 곧 상장 : 이 합병을 천천히 (① 컷)
      const toIpo = !SIM && stage === S.top - 1 && ipoNext(t, stage);
      const fromName = S.stages[t.stage].name, oldValue = value(t);
      if (toIpo) { t.stage = stage; await uniMerge(t, gone, fromName); }
      else if (!SIM) for (const g of gone) { g.el.style.translate = t.el.style.translate; g.el.classList.add('suck'); setTimeout(() => g.el.remove(), 160); }
      S.chain++;
      const gain = Math.round(valueOf(stage, t.type) * M.raiseRate) * S.chain;   // 그 단계 투자 유치
      t.stage = stage;
      S.cash += gain;
      if (!SIM) {
        await sleep(110);
        restyle(t);
        t.el.classList.remove('pop', 'flash'); void t.el.offsetWidth; t.el.classList.add('flash');
        const [mx, my] = mid(t.c, t.r);
        floatAt(mx, my - CELL * 0.3, '+' + gain + (stage >= S.top - 1 ? ' ' + S.stages[stage].name + '!' : ''));
        shards(mx, my, stage, 16 + stage * 3 + gone.length * 8, t.type);
        sfx.merge(stage, S.chain + gone.length - 1);
        coins(mx, my, gain);
        if (gone.length >= 2) chainText(mx, my - CELL * 0.9, `${gone.length + 1}개 동시 합병!`);
        if (S.chain >= 2) { chainText(mx, my - CELL * 0.4, S.chain); shake(); flashBox(); buzz([25, 30, 25 + S.chain * 10]); }
        else if (gone.length >= 2) { shake(); flashBox(); buzz([30, 30, 60]); }
        else { nudge(); buzz(stage >= S.top - 1 ? [40, 40, 80] : 18); }
        if (stage === S.top - 1 && !toIpo) { sfx.unicorn(); confetti(40); }
        paintHUD();
        await sleep(130);
      }
      const moved = await gravity();
      active.unshift(t, ...moved);
    }
  }

  // 빈칸 위의 회사들이 아래로 내려옴. 움직인 회사 목록을 돌려줌.
  async function gravity() {
    const moved = [];
    for (let c = 0; c < C; c++) {
      let w = H - 1;
      for (let r = H - 1; r >= 0; r--) {
        const t = S.grid[r][c];
        if (!t) continue;
        if (r !== w) { S.grid[w][c] = t; S.grid[r][c] = null; t.r = w; moved.push(t); }
        w--;
      }
    }
    if (!SIM && moved.length) { for (const t of moved) place(t); await sleep(140); }
    return moved;
  }

  // 상장까지 세 컷 : ① 내가 만든 합병(두 번째 유니콘이 생김) ② 유니콘 + 유니콘 ③ 종.
  //   ①②는 판을 어둡게 하고 합쳐지는 회사만 빛낸 뒤 천천히 끌려와 하나로 (어떻게 깼는지 보이게)
  async function slowMerge(t, gone, text, look, pull, hold, onJoin) {
    boxEl.classList.add('ipoDim');
    for (const o of [t, ...gone]) { o.el.classList.remove('pull'); o.el.classList.add('star'); o.el.style.setProperty('--pull', pull + 'ms'); }
    banner(text, true);
    buzz(30);
    await sleep(look);
    for (const g of gone) { g.el.classList.add('pull'); g.el.style.translate = t.el.style.translate; }
    await sleep(pull);
    for (const g of gone) g.el.remove();
    if (onJoin) onJoin();
    t.el.classList.remove('land'); void t.el.offsetWidth; t.el.classList.add('land');
    flashBox(); shake(); buzz([40, 30, 80]);
    await sleep(hold);
    t.el.classList.remove('star');
    boxEl.classList.remove('ipoDim');
  }
  // ① 두 번째 유니콘이 생기는 합병 (곧 상장할 때만)
  const uniMerge = (t, gone, from) => slowMerge(t, gone, `${from} + ${from} → 유니콘`, 400, 250, 450, () => { restyle(t); sfx.unicorn(); confetti(30); });
  // ② 유니콘 + 유니콘
  async function ipoMerge(t, gone) {
    sfx.unicorn();
    await slowMerge(t, gone, `${t.type.name} 유니콘 + 유니콘`, 400, 250, 350);
  }
  // 상장 종 : 합쳐진 자리 위(판 안쪽으로)에서 흔들리며 땡땡땡
  function ringBell(x, y) {
    const el = $('bell'), r = boxEl.getBoundingClientRect();
    const bx = r.left + Math.min(Math.max(x, 80), r.width - 80), by = r.top + Math.min(Math.max(y - 30, 90), r.height - 90);
    el.style.left = bx + 'px'; el.style.top = by + 'px';
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    sfx.bell();
    setTimeout(() => sfx.ipo(), 1500);
  }
  async function ipo(keep, gone) {
    const v = valueOf(S.top, keep.type) * M.ipoMul;
    S.score = (S.score || 0) + v;   // 상장 대금은 누적 상장(점수)으로. 지갑은 다음 레벨에 자본금으로 새로
    if (!SIM && S.score > S.best) { S.best = S.score; try { localStorage.setItem('rdc.best', String(S.best)); } catch (e) {} }
    S.ipos++;
    if (!S.firstIpo) S.firstIpo = S.turn;
    S.over = true; S.cleared = true;
    save();
    if (SIM) return;
    keep.el.classList.add('gone');
    setTimeout(() => keep.el.remove(), 200);
    const [mx, my] = mid(keep.c, keep.r);
    floatAt(mx, my, '+' + v);
    banner(`${keep.type.name} 상장! +${v}`, true);
    shards(mx, my, S.top - 1, 40);
    shake(); flashBox(); confetti(90); coins(mx, my, v, 'sScoreBox');
    buzz([60, 40, 60, 40, 120]);
    ringBell(mx, my);
    paintHUD();
    const showClear = () => setTimeout(() => {
      $('overTitle').textContent = `레벨 ${S.level} 클리어!`;
      $('overScore').textContent = '+' + v;
      $('overText').innerHTML = `${keep.type.name} 회사가 상장했어요 · ${S.turn}턴 · 위기 매각 ${S.dumps}번<br>누적 상장 ${S.score} (최고 ${S.best})<br>다음 레벨은 자본금 ${M.startCash}으로 새로 시작해요`;
      $('bRestart').textContent = `레벨 ${S.level + 1} 시작`;
      $('over').classList.remove('hide');
    }, 200);
    setTimeout(() => queueCard('end', keep.type, showClear), 2000);
  }

  })();

  // ---------- 실제 회사 카드 (data/cards.json에 있는 것만) ----------
  const DATA = { cards: [], companies: {} };
  const ROBOT_GROUP = { arm: 'cobot', amr: 'service', legs: 'quadruped', hum: 'humanoid' };   // AMR은 서비스로봇 묶음
  const EVENT_NAME = { found: '창업', grow: '성장', market: '시장', steal: '빼앗김', merge: '합병', sell: '매각', ipo: '상장', crash: '재정 위기', close: '사업 정리', regulate: '규제' };
  // 게임 순간마다 쓰는 카드 묶음 : 모든 카드가 다 나오게
  const MOMENT = {
    start: ['found', 'market', 'regulate', 'steal'],        // 레벨 시작 : 창업·시장·규제·경쟁
    end: ['ipo', 'grow', 'merge', 'sell'],                  // 레벨 끝 : 상장·성장·투자·인수
    crisis: ['crash', 'close']                              // 위기 : 위기·사업 정리 이야기만
  };
  const GROUP = {
    cobot: { name: '협동로봇', icon: 'robot-cobot' },
    quadruped: { name: '4족보행', icon: 'robot-quad' },
    humanoid: { name: '휴머노이드', icon: 'tile-hum' },
    service: { name: '서비스로봇·AMR', icon: 'robot-amr' },
    parts: { name: '부품·SW', icon: 'tile-tool' },
    industrial: { name: '산업용 로봇', icon: 'tile-iarm' }
  };
  const used = new Set();
  // 도감 : 받은 카드 id 목록을 휴대폰에 저장
  const loadGot = () => { try { return new Set(JSON.parse(localStorage.getItem('rdc.cards') || '[]')); } catch (e) { return new Set(); } };
  const saveGot = d => { try { localStorage.setItem('rdc.cards', JSON.stringify([...d])); } catch (e) {} };
  const companyOf = card => DATA.companies[card.company] || {};
  // 카드의 로봇 종류 : 제목·본문에 가장 먼저 나오는 로봇 이름으로. 없으면 회사 분류대로.
  //   (예 : 4족 회사 유니트리의 휴머노이드 공연 카드는 휴머노이드)
  const CARD_WORDS = { humanoid: ['휴머노이드'], quadruped: ['4족', '사족', '로봇개'], cobot: ['협동로봇'], service: ['청소로봇', '배송', '배달', '서빙', '물류', 'AMR'] };
  function cardGroup(card) {
    const text = (card.title || '') + ' ' + card.text;
    let best = null, at = Infinity;
    for (const [g, words] of Object.entries(CARD_WORDS)) for (const w of words) {
      const i = text.indexOf(w);
      if (i >= 0 && i < at) { at = i; best = g; }
    }
    return best || companyOf(card).type;
  }
  Promise.all([fetch('data/cards.json').then(r => r.json()), fetch('data/companies.json').then(r => r.json())])
    .then(([cards, cos]) => { DATA.cards = cards; for (const c of cos) DATA.companies[c.id] = c; if (cardQueue.length) showCard(); })
    .catch(() => { DATA.failed = true; while (cardQueue.length) { const q = cardQueue.shift(); if (q.after) q.after(); } });
  // 그 로봇 업종의 카드 중 아직 안 본 것 (판의 흐름과 이어지게)
  function pickCard(moment, type) {
    const group = ROBOT_GROUP[type.key], kinds = MOMENT[moment];
    const of = c => kinds.includes(c.type) && !used.has(c.id);
    // 그 로봇 업종 카드만 : 다 봤으면 그 업종 카드를 처음부터 다시 (다른 업종으로 넘어가지 않음)
    const mine = c => kinds.includes(c.type) && cardGroup(c) === group;
    let pool = DATA.cards.filter(c => mine(c) && !used.has(c.id));
    if (!pool.length) { for (const c of DATA.cards) if (mine(c)) used.delete(c.id); pool = DATA.cards.filter(mine); }
    if (!pool.length) pool = DATA.cards.filter(of);   // 그 업종 카드가 아예 없을 때만
    const card = pool[rnd(pool.length)];
    if (card) used.add(card.id);
    return card;
  }
  const cardQueue = [];
  function queueCard(event, type, after) {
    if (SIM || DATA.failed) { if (after) after(); return; }
    cardQueue.push({ event, type, after });
    if (cardQueue.length === 1 && DATA.cards.length) showCard();
  }
  function showCard() {
    const q = cardQueue[0];
    if (!q) return;
    const card = pickCard(q.event, q.type);
    if (!card) { cardQueue.shift(); if (q.after) q.after(); showCard(); return; }
    const co = companyOf(card);
    const got = loadGot(); const isNew = !got.has(card.id); got.add(card.id); saveGot(got);
    fillCard(card);
    const coGot = new Set([...got].map(id => (DATA.cards.find(c => c.id === id) || {}).company));
    $('cDex').textContent = `${isNew ? '새 카드! ' : ''}도감 ${coGot.size}/${Object.keys(DATA.companies).length}개사 · ${got.size}/${DATA.cards.length}장`;
    S.paused = true;
    $('card').classList.remove('hide');
    sfx.card();
  }
  function fillCard(card) {
    const co = companyOf(card);
    $('cEv').textContent = EVENT_NAME[card.type] || card.type;
    $('cPic').src = `assets/${(GROUP[cardGroup(card)] || GROUP.service).icon}-a.png`;
    $('cCo').textContent = co.name || '';
    $('cEn').textContent = [co.en, co.country].filter(Boolean).join(' · ');
    $('cTi').textContent = card.title || '';
    $('cTx').textContent = card.text;
    $('cYr').textContent = card.year;
  }
  $('card').addEventListener('click', () => {
    if (dexCard) { dexCard = false; $('card').classList.add('hide'); return; }   // 도감에서 다시 보던 카드
    const q = cardQueue.shift();
    $('card').classList.add('hide');
    S.paused = cardQueue.length > 0;
    if (q && q.after) q.after();
    showCard();
  });

  // ---------- 도감 : 43개사, 받은 카드 다시 보기 ----------
  let dexCard = false;
  function openDex() {
    if (!DATA.cards.length) { banner('카드를 불러오는 중이에요'); return; }
    S.paused = true;
    const got = loadGot();
    const cos = Object.values(DATA.companies);
    const cardsOf = id => DATA.cards.filter(c => c.company === id);
    const coGot = cos.filter(co => cardsOf(co.id).some(c => got.has(c.id))).length;
    $('dexSum').textContent = `${coGot}/${cos.length}개사 · 카드 ${got.size}/${DATA.cards.length}장`;
    $('dexList').innerHTML = Object.entries(GROUP).map(([g, info]) => {
      // 주 분류 + 'also'(이 분야도 하는 회사)
      const list = cos.filter(co => co.type === g || (co.also || []).includes(g));
      return `<div class="grp"><div class="gh"><img src="assets/${info.icon}-a.png" alt="">${info.name}</div>` +
        list.map(co => {
          const all = cardsOf(co.id), n = all.filter(c => got.has(c.id)).length;
          return `<button class="co ${n ? '' : 'locked'}" data-id="${co.id}">` +
            `<b>${n ? co.name : '???'}</b><span>${n ? co.country : '아직 못 만났어요'}${co.type !== g && n ? ` · ${GROUP[co.type].name}에서도` : ''}</span><i>${n}/${all.length}</i></button>`;
        }).join('') + '</div>';
    }).join('');
    $('dexDetail').classList.add('hide');
    $('dex').classList.remove('hide');
  }
  function openCompany(id) {
    const co = DATA.companies[id], got = loadGot();
    const all = DATA.cards.filter(c => c.company === id);
    if (!all.some(c => got.has(c.id))) { banner('카드를 받으면 열려요'); return; }
    $('ddName').textContent = co.name;
    $('ddEn').textContent = `${co.en} · ${co.country}`;
    $('ddOne').textContent = co.oneLine;
    $('ddCards').innerHTML = all.map(c => got.has(c.id)
      ? `<button class="dc" data-card="${c.id}"><em>${EVENT_NAME[c.type] || c.type}</em><b>${c.title || ''}</b><span>${c.year}</span></button>`
      : `<div class="dc locked"><em>?</em><b>아직 못 받은 카드</b><span></span></div>`).join('');
    $('dexDetail').classList.remove('hide');
  }
  $('bDex').addEventListener('click', openDex);
  $('dexClose').addEventListener('click', () => { $('dex').classList.add('hide'); S.paused = menuOpen; });
  $('ddBack').addEventListener('click', () => $('dexDetail').classList.add('hide'));
  $('dexList').addEventListener('click', e => { const b = e.target.closest('.co'); if (b) openCompany(b.dataset.id); });
  $('ddCards').addEventListener('click', e => {
    const b = e.target.closest('.dc[data-card]');
    if (!b) return;
    dexCard = true;
    fillCard(DATA.cards.find(c => c.id === b.dataset.card));
    $('cDex').textContent = '도감에서 다시 보기';
    $('card').classList.remove('hide');
  });

  // 입력 : 손가락 좌우 → 줄 고르기, 떼면 떨어뜨림
  let touch = null;
  const colAt = clientX => Math.round((clientX - boxEl.getBoundingClientRect().left - GAP - CELL / 2) / SX);
  boxEl.addEventListener('pointerdown', e => {
    sfx.unlock();
    if (S.over || S.paused || S.busy || S.crisis) return;
    e.preventDefault();
    touch = { id: e.pointerId };
    boxEl.setPointerCapture(e.pointerId);
    aim(colAt(e.clientX));
  });
  boxEl.addEventListener('pointermove', e => {
    if (!touch || e.pointerId !== touch.id) return;
    aim(colAt(e.clientX));
  });
  boxEl.addEventListener('pointerup', e => {
    if (!touch || e.pointerId !== touch.id) return;
    touch = null;
    const c = colAt(e.clientX);
    if (c >= 0 && c < C) dropAt(c);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') aim(S.col - 1);
    else if (e.key === 'ArrowRight') aim(S.col + 1);
    else if (e.key === 'ArrowDown' || e.key === ' ') dropAt(S.col);
  });

  $('bNew').addEventListener('click', () => { if ((S.turn === 0 && S.level === 1) || confirm('레벨 1부터 새로 시작할까요?')) newGame(); });
  $('bRestart').addEventListener('click', () => {
    if (S.cleared) { S.level++; startLevel(); }
    else newGame();
  });
  // 화면이 바뀌거나 글꼴이 늦게 들어와 위쪽이 커지면 판 크기를 다시 맞춤 (판이 아래 버튼을 가리지 않게)
  let fitT = 0, lastMainH = 0;
  const refit = () => {
    clearTimeout(fitT);
    fitT = setTimeout(() => {
      const h = $('main').clientHeight;
      if (h === lastMainH) return;
      if (S.busy || S.crisis) { refit(); return; }   // 떨어지는 중이면 끝난 뒤에
      lastMainH = h;
      buildBoard();
    }, 120);
  };
  window.addEventListener('resize', refit);
  if (window.ResizeObserver) new ResizeObserver(refit).observe($('main'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

  // 시험용 봇 : 줄마다 떨어뜨려 보고 같은 회사 옆이면 높은 점수. window.simulate(판 수, 최대 턴, 솜씨 0-1, 레벨)
  window.simulate = async (games, maxTurns = 400, skill = 0.8, level = 1) => {
    const out = [];
    for (let g = 0; g < games; g++) {
      newGame(true);
      if (level > 1) { S.level = level; startLevel(); }
      while (!S.over && S.turn < maxTurns) {
        let best = -1, bs = -Infinity;
        for (let c = 0; c < C; c++) {
          if (!canDrop(c)) continue;
          if (topMerge(c)) { if (bs < 50) { bs = 50; best = c; } continue; }   // 꽉 찬 줄 위 합병은 늘 좋은 수
          let r = H - 1; while (S.grid[r][c]) r--;
          let sc = Math.random() * (1 - skill) * 12 - (H - r) * 0.2;
          for (const [rr, cc] of NBR(r, c)) {
            const o = rr >= 0 && rr < H && cc >= 0 && cc < C ? S.grid[rr][cc] : null;
            if (!o) continue;
            if (same(o, S.cur)) sc += 10 * skill;
            else if (o.type === S.cur.type) sc += (o.stage === S.cur.stage + 1 ? 3 : 1) * skill;
            else sc -= 1 * skill;
          }
          if (sc > bs) { bs = sc; best = c; }
        }
        if (best < 0) break;
        await dropAt(best);
      }
      out.push({ firstIpo: S.firstIpo, dumps: S.dumps, turn: S.turn, minCash: S.minCash, crises: S.crises });
    }
    newGame();
    return out;
  };

  // ---------- 시작 창 ----------
  let menuOpen = true, pendingStart = false;
  function closeMenu() {
    sfx.unlock();
    menuOpen = false;
    $('menu').classList.add('hide');
    $('tut').classList.add('hide');
    S.paused = false;
    if (pendingStart) { pendingStart = false; setTimeout(() => queueCard('start', S.cur ? S.cur.type : S.types[0]), 300); }
  }
  $('mStart').addEventListener('click', closeMenu);
  // 저장된 판을 버리고 레벨 1부터
  $('mNew').addEventListener('click', () => { newGame(); closeMenu(); });
  $('mDex').addEventListener('click', () => { sfx.unlock(); openDex(); });
  $('mSound').addEventListener('click', toggleSound);
  $('bSound').addEventListener('click', toggleSound);
  $('mTut').addEventListener('click', () => { sfx.unlock(); tutAt(0); $('tut').classList.remove('hide'); });

  // ---------- 튜토리얼 : 그림이 들어간 일곱 장 ----------
  // 미리보기 칸 : 로봇 종류 색조 × 단계 명도
  function demo(typeKey, stageKey, size = 58, extra = '') {
    const ty = M.types.find(t => t.key === typeKey), sh = M.shade[stageKey];
    const vars = sh ? `--c:hsl(${ty.hue} ${sh[1] * ty.sat}% ${sh[0]}%);--c2:hsl(${ty.hue} ${Math.min(100, sh[1] * ty.sat + 10)}% ${Math.round(sh[0] * 0.72)}%);--c3:hsl(${ty.hue} ${Math.min(100, sh[1] * ty.sat + 12)}% ${Math.round(sh[0] * 0.45)}%);--rim:hsl(${ty.hue} ${sh[1] * ty.sat}% ${Math.round(sh[0] * 0.66)}%);` : '';
    const le = sh ? lightEdge(ty, sh[0]) : {};
    const vars2 = vars + (le.bev ? `--bev:${le.bev};--rim:${le.rim};` : '') + (ty.hue != null ? `--tx:${textOf(ty)};` : '');
    return `<div class="ball st-${stageKey} ${extra}" style="${vars2}width:${size}px;height:${size}px">${faceHTML(ty.tile, stageKey, size)}</div>`;
  }
  const TUT = [
    { t: '떨어뜨리기', v: () => `<span>👆</span>${demo('arm', 'found')}<span class="big">↓</span>`,
      p: '판 위에서 손가락을 좌우로 움직여 줄을 고르고, 떼면 그 줄 맨 아래까지 떨어져요.' },
    { t: '합병', v: () => `${demo('arm', 'found', 50)}+${demo('arm', 'found', 50)}<span class="big">→</span>${demo('arm', 'seed', 58)}`,
      p: '같은 그림에 같은 숫자인 회사가 위아래나 옆으로 닿으면, 떨어뜨린 칸으로 합쳐져 숫자가 하나 올라가요. 양쪽에 둘이 닿으면 한꺼번에 두 단계! 작은 로봇일수록 낮은 단계, 큰 로봇일수록 높은 단계예요.' },
    { t: '연쇄', v: () => `${demo('amr', 'seed', 50)}<span class="big">2연쇄!</span>${demo('amr', 'a', 58)}`,
      p: '합쳐진 회사가 내려오거나 커지면서 또 같은 회사와 닿으면 연쇄가 터져요. 연쇄일수록 버는 돈이 몇 배로 늘어요.' },
    { t: '유니콘과 상장', v: () => `${demo('hum', 'a', 46)}<span>→</span>${demo('hum', 'uni', 54)}<span>×2 → 상장</span>`,
      p: '창업 → 시드투자 → 시리즈A → … → 유니콘으로 키워요. 유니콘 둘을 합치면 상장하고 레벨을 깨요. 레벨이 오르면 거쳐야 할 단계와 로봇 종류가 늘어요.' },
    { t: '돈', v: () => `<span style="color:#F0426E">-10</span>${demo('legs', 'found', 54)}<span style="color:#1FA36B">+5</span>`,
      p: `떨어뜨리면 창업 비용이 나가고, 합병해 단계가 오르면 그 단계 투자금이 들어와요. 합치지 못한 회사가 쌓이면 돈이 말라 재정 위기가 와요. 레벨마다 자본금 ${M.startCash}으로 새로 시작하고, 상장 대금은 누적 상장 점수가 돼요.` },
    { t: '위기', v: () => `${demo('legs', 'b', 58, 'firesale')}<span style="color:#C9443A">헐값!</span>`,
      p: `적자가 ${M.crisisAt}을 넘으면 재정 위기, 판이 꽉 차면 경영 위기가 와요. 재정 위기에는 채권단이 가장 비싼 회사를 가져가고 빚을 정리해 줘요. 경영 위기에는 비싼 회사 여섯 개가 반값에 팔려 나가요.` },
    { t: '실제 회사 카드', v: () => `<div style="width:64px;height:84px;border-radius:10px;border:3px solid #1E3F8F;background:#FBFCFF;display:flex;align-items:center;justify-content:center;font-size:30px">📜</div>`,
      p: '레벨을 시작하고 끝낼 때, 위기가 올 때 실제 로봇 회사의 이야기 카드를 받아요. 모은 카드는 아래 "도감"에서 다시 볼 수 있어요.' }
  ];
  let tutI = 0;
  function tutAt(i) {
    tutI = Math.max(0, Math.min(TUT.length - 1, i));
    const sl = TUT[tutI];
    $('tutN').textContent = `${tutI + 1} / ${TUT.length}`;
    $('tutV').innerHTML = sl.v();
    $('tutT').textContent = sl.t;
    $('tutP').textContent = sl.p;
    $('tPrev').style.visibility = tutI ? 'visible' : 'hidden';
    $('tNext').textContent = tutI === TUT.length - 1 ? '시작하기' : '다음';
    sfx.card();
  }
  $('tPrev').addEventListener('click', () => tutAt(tutI - 1));
  $('tNext').addEventListener('click', () => { if (tutI === TUT.length - 1) closeMenu(); else tutAt(tutI + 1); });
  $('tSkip').addEventListener('click', closeMenu);

  paintSound();
  if (load()) { $('mStart').textContent = `이어서 하기 (레벨 ${S.level})`; $('mNew').style.display = ''; }
  else newGame();
  S.paused = true;

  // 새 버전이 올라오면 저절로 새로고침 (Robot Rush와 같은 방식)
  (function checkNewVersion() {
    if (!/github\.io$/.test(location.hostname)) return;
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      const m = t.match(/BUILD_V = '([^']+)'/);
      if (!m || m[1] === BUILD_V) return;
      let tried = null; try { tried = sessionStorage.getItem('rdc.reloadTo'); } catch (e) {}
      if (tried === m[1]) return;   // 이미 한 번 시도한 버전이면 다시 새로고침하지 않음
      try { sessionStorage.setItem('rdc.reloadTo', m[1]); } catch (e) {}
      location.replace(location.pathname + '?b=' + m[1]);
    }).catch(() => {});
  })();
})();
</script>
</body>
</html>
