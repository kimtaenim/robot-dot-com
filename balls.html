<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#56636F">
<title>ROBOT-DOT-COM 로봇닷컴 : 공 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Sunflower:wght@700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #56636F; --fg: #F2F5F7; --panel: #48535E; --me: #1FA8E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  #hud { flex: none; text-align: center; padding: 8px 12px 4px; width: 100%; }
  #title { font-family: 'Rye', serif; font-size: 24px; letter-spacing: 1px; line-height: 1.1; }
  #subtitle { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 13px; opacity: .85; margin-top: 2px; }
  #stats { display: flex; justify-content: center; gap: 4px; margin-top: 6px; font-size: 13px; white-space: nowrap; }
  .stat { background: var(--panel); border-radius: 8px; padding: 3px 7px; display: flex; gap: 4px; align-items: center; }
  .stat b { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; }
  .stat.cash b { color: #FFE27A; }
  .stat.cash.red { background: #8E2A24; animation: urgent .6s ease-in-out infinite alternate; }
  .stat.cash.red b { color: #fff; }
  @keyframes urgent { from { opacity: 1; } to { opacity: .6; } }

  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; width: 100%; padding-top: 4px; }
  #box.shake { animation: shake .35s ease-in-out; }
  @keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -5px 2px; } 40% { translate: 5px -2px; } 60% { translate: -4px 1px; } 80% { translate: 3px 0; } }
  /* 도자기 파편 */
  .shard { position: absolute; z-index: 7; width: 7px; height: 5px; border-radius: 2px; pointer-events: none; animation: shard .6s ease-out forwards; }
  @keyframes shard { from { transform: translate(-50%, -50%) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; } }
  /* 연쇄 */
  .chain { position: absolute; z-index: 9; pointer-events: none; transform: translate(-50%, -50%); font-family: 'Sunflower', sans-serif; font-weight: 700; color: #FFE27A; -webkit-text-stroke: 1.5px #0C2163; text-shadow: 0 3px 0 #0C2163; white-space: nowrap; animation: chainPop 1s ease-out forwards; }
  @keyframes chainPop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 35% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }

  /* 실제 회사 카드 : Delft 블루 도자기 타일 */
  #card { position: fixed; inset: 0; z-index: 25; background: rgba(12, 22, 48, .72); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #card.hide { display: none; }
  .cardBox { width: 100%; max-width: 340px; background: #FBFCFF; color: #10275F; border-radius: 18px; border: 4px solid #1E3F8F; box-shadow: inset 0 0 0 3px #FBFCFF, inset 0 0 0 5px #6F94D6, 0 14px 30px rgba(0,0,0,.45); padding: 18px 18px 14px; text-align: center; animation: cardIn .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .cardBox .ev { display: inline-block; background: #1E3F8F; color: #fff; border-radius: 999px; padding: 2px 14px; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; }
  .cardBox .pic { width: 74px; height: 74px; margin: 8px auto 2px; position: relative; }
  .cardBox .pic img { width: 100%; height: 100%; object-fit: contain; filter: grayscale(1) sepia(1) saturate(5) hue-rotate(175deg) brightness(.55) contrast(1.6); }
  .cardBox .co { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 22px; }
  .cardBox .en { font-size: 12px; opacity: .65; }
  .cardBox .ti { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px; margin-top: 8px; color: #1E3F8F; }
  .cardBox p { font-size: 14px; line-height: 1.6; margin-top: 6px; text-align: left; word-break: keep-all; }
  .cardBox .yr { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; margin-top: 10px; color: #1E3F8F; }
  .cardBox .foot { display: flex; justify-content: space-between; font-size: 11px; opacity: .6; margin-top: 8px; }

  /* 도감 : Delft 블루 */
  #dex, #dexDetail { position: fixed; inset: 0; z-index: 24; background: #F3F6FC; color: #10275F; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); }
  #dex.hide, #dexDetail.hide { display: none; }
  .dexHead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 3px double #6F94D6; }
  .dexHead .dt { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 20px; }
  .dexHead .ds { font-size: 12px; opacity: .7; }
  .dexHead button { height: 36px; padding: 0 14px; border: 2px solid #1E3F8F; border-radius: 18px; background: #fff; color: #1E3F8F; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 14px; }
  #dexList, #ddCards { flex: 1; overflow-y: auto; padding-top: 6px; touch-action: pan-y; }
  .grp .gh { display: flex; align-items: center; gap: 6px; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px; margin: 10px 0 6px; color: #1E3F8F; }
  .grp .gh img { width: 26px; height: 26px; filter: grayscale(1) sepia(1) saturate(5) hue-rotate(175deg) brightness(.55) contrast(1.6); }
  .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grp .gh { grid-column: 1 / -1; }
  .grp .co { position: relative; text-align: left; background: #fff; border: 2px solid #1E3F8F; border-radius: 10px; padding: 6px 8px; color: #10275F; font: inherit; }
  .grp .co b { display: block; font-family: 'Sunflower', sans-serif; font-size: 14px; }
  .grp .co span { font-size: 11px; opacity: .65; }
  .grp .co i { position: absolute; right: 6px; top: 6px; font-style: normal; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1E3F8F; }
  .grp .co.locked { background: #E3E9F4; border-style: dashed; color: #7A8AAE; }
  .ddTop { padding: 10px 2px; }
  .ddTop .dn { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 24px; }
  .ddTop .de { font-size: 12px; opacity: .65; }
  .ddTop .do { font-size: 14px; margin-top: 6px; line-height: 1.5; word-break: keep-all; }
  .dc { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: #fff; border: 2px solid #1E3F8F; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; color: #10275F; font: inherit; }
  .dc em { font-style: normal; background: #1E3F8F; color: #fff; border-radius: 999px; padding: 1px 8px; font-family: 'Sunflower', sans-serif; font-size: 12px; flex: none; }
  .dc b { flex: 1; font-family: 'Sunflower', sans-serif; font-size: 14px; }
  .dc span { font-family: 'IBM Plex Mono', monospace; font-size: 12px; opacity: .7; }
  .dc.locked { background: #E3E9F4; border-style: dashed; color: #7A8AAE; }
  .dc.locked em { background: #9AA8C6; }

  #box { flex: none; position: relative; background: #3E4852; border-radius: 14px; box-shadow: 0 0 0 4px #2E363E, 0 10px 24px rgba(0,0,0,.35); overflow: hidden; }
  #line { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(255, 138, 128, .55); pointer-events: none; }
  #line.warn { border-top-color: #FF5A4E; animation: urgent .3s ease-in-out infinite alternate; }
  #guide { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dotted rgba(255,255,255,.18); pointer-events: none; }

  /* 공 = 입체 뱃지 : 빛 받는 볼록면 + 진한 테두리 + 안쪽 흰 링 + 윗부분 광택 + 그림자 */
  .ball {
    position: absolute; left: 0; top: 0; border-radius: 50%; will-change: translate;
    background: radial-gradient(circle at 34% 28%, #fff 0%, var(--c) 42%, var(--c2) 100%);
    border: 3px solid var(--c3);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -6px 8px rgba(0,0,0,.22), 0 4px 0 var(--c3), 0 6px 8px rgba(0,0,0,.35);
  }
  /* 구르는 면 : 그림·테두리 무늬가 같이 돌고, 이름표·광택은 제자리 */
  .ball .face { position: absolute; inset: 0; border-radius: 50%; }
  /* 도자기 접시 테두리 무늬 */
  .ball .face::before {
    content: ''; position: absolute; inset: 7%; border-radius: 50%;
    border: 2px dotted var(--ink); opacity: .7; pointer-events: none; z-index: 1;
  }
  .ball::after {
    content: ''; position: absolute; left: 16%; top: 7%; width: 46%; height: 26%; border-radius: 50%;
    background: linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,0)); transform: rotate(-24deg); pointer-events: none; z-index: 2;
  }
  .ball .art { position: absolute; z-index: 1; left: 15%; top: 10%; width: 70%; height: 70%; }
  .ball .stg { position: absolute; z-index: 3; left: 50%; bottom: 6%; transform: translateX(-50%); box-shadow: 0 1px 2px rgba(0,0,0,.25); font-family: 'Sunflower', sans-serif; font-weight: 700; color: #1C3577; background: rgba(255,255,255,.9); border-radius: 5px; padding: 0 4px; line-height: 1.3; white-space: nowrap; }
  .ball.held { opacity: .92; }
  .ball.pop { animation: pop .25s ease-out; }
  .ball.pick { animation: pickGlow .55s ease-in-out infinite alternate; }
  .ball.sel { filter: brightness(1.15) drop-shadow(0 0 8px #FFE27A); }
  @keyframes pop { 0% { scale: .7; } 60% { scale: 1.15; } 100% { scale: 1; } }
  @keyframes pickGlow { from { filter: brightness(1); } to { filter: brightness(1.2) drop-shadow(0 0 6px #FF8A80); } }
  /* 알록달록 : 창업 노랑 → 시드 주황 → 시리즈A 분홍 → 시리즈B 보라 → 유니콘 무지개 */
  .s0 { --c: #FFE45C; --c2: #F5B700; --c3: #B07A00; --ink: #FFFFFF; }
  .s1 { --c: #FFB15C; --c2: #F57A1F; --c3: #B04A00; --ink: #FFFFFF; }
  .s2 { --c: #FF8FB0; --c2: #F0426E; --c3: #A8183F; --ink: #FFFFFF; }
  .s3 { --c: #B79CFF; --c2: #7B4DF0; --c3: #4A1FA8; --ink: #FFFFFF; }
  .s4 { --c3: #C8962A; --ink: #FFFFFF; background: radial-gradient(circle at 34% 28%, #fff 0%, #FFB3E6 22%, #C9A2FF 50%, #7FD8FF 78%, #5AA8E0 100%); border-color: #E8B94A; }

  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .art.bob { transform-origin: 50% 85%; animation: artBob 1s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .art.bob img.b { display: none; }
  .art.bob.swap img.b { display: block; }
  .art.bob.swap img { animation: artA 1s steps(1, end) infinite; animation-delay: var(--d, 0s); }
  .art.bob.swap img.b { animation-name: artB; }
  @keyframes artA { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes artB { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes artBob { 0%, 100% { rotate: -14deg; translate: 0 0; } 25% { rotate: 0deg; translate: 0 -18%; } 50% { rotate: 14deg; translate: 0 0; } 75% { rotate: 0deg; translate: 0 -18%; } }

  #legendTypes { display: flex; gap: 10px; justify-content: center; font-size: 12px; }
  #legendTypes span { display: inline-flex; align-items: center; gap: 3px; }
  #legendTypes img { width: 22px; height: 22px; }
  #hint { font-size: 12.5px; opacity: .8; text-align: center; padding: 0 16px; }

  #actions { flex: none; display: flex; gap: 6px; padding: 6px 10px 10px; width: 100%; max-width: 390px; }
  #actions button { flex: 1; height: 46px; border: none; border-radius: 10px; background: var(--panel); color: var(--fg); font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 15px; }
  /* 재정 위기 : 헐값에 팔려 나가는 공 */
  .ball.firesale { filter: brightness(1.3) drop-shadow(0 0 10px #FF5A4E); scale: 1.12; transition: scale .25s; z-index: 6; }
  #banner.crisis { background: linear-gradient(135deg, #8E2A24, #C9443A); }
  /* 빚 천장 : 적자가 커질수록 위쪽 선이 내려옴 */
  #line span { position: absolute; right: 6px; top: 2px; font-size: 11px; color: #FF8A80; font-family: 'Sunflower', sans-serif; font-weight: 700; }
  #line { transition: top .4s ease-out; }

  .float { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -50%); font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; color: #FFE27A; text-shadow: 0 1px 0 #2A2F35, 0 0 4px #2A2F35; animation: floatUp 1.1s ease-out forwards; white-space: nowrap; }
  @keyframes floatUp { to { transform: translate(-50%, -60px); opacity: 0; } }
  #banner { position: fixed; left: 50%; top: 40%; z-index: 20; pointer-events: none; background: rgba(30, 36, 42, .9); border-radius: 12px; padding: 12px 18px; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 18px; text-align: center; opacity: 0; transform: translate(-50%, -50%) scale(.5); white-space: nowrap; }
  #banner.show { animation: banner 1.8s ease-out; }
  #banner.ipo { background: linear-gradient(135deg, #C2367F, #6A4BD8); }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

  #over { position: fixed; inset: 0; z-index: 30; background: rgba(40, 47, 54, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 20px; }
  #over.hide { display: none; }
  #over .big { font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 26px; }
  #over .score { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 46px; color: #FFE27A; }
  #over p { font-size: 14px; opacity: .85; line-height: 1.6; }
  #over button { margin-top: 12px; height: 52px; padding: 0 28px; border: none; border-radius: 10px; background: var(--me); color: #10222C; font-family: 'Sunflower', sans-serif; font-weight: 700; font-size: 17px; }
</style>
</head>
<body>

<div id="hud">
  <div id="title">★ROBOT-DOT-COM★</div>
  <div id="subtitle">로봇닷컴 : 공 시제품</div>
  <div id="stats">
    <div class="stat"><span>레벨</span><b id="sLevel">1</b></div>
    <div class="stat"><span>턴</span><b id="sTurn">0</b></div>
    <div class="stat cash" id="sCashBox"><span>지갑</span><b id="sCash">0</b></div>
    <div class="stat"><span>몸값</span><b id="sBoard">0</b></div>
    <div class="stat"><span>다음</span><span id="nextBall"></span></div>
  </div>
</div>

<div id="main">
  <div id="box">
    <div id="guide"></div>
    <div id="line"><span id="lineTxt"></span></div>
  </div>
  <div id="legendTypes"></div>
  <div id="hint">좌우로 겨누고 떼면 떨어져요. 같은 공끼리 닿으면 더 큰 공이 돼요.</div>
</div>

<div id="actions"><button id="bDex">도감</button><button id="bNew">새 판</button></div>
<div id="banner"></div>
<div id="dex" class="hide">
  <div class="dexHead"><div><div class="dt">로봇 회사 도감</div><div class="ds" id="dexSum"></div></div><button id="dexClose">닫기</button></div>
  <div id="dexList"></div>
  <div id="dexDetail" class="hide">
    <div class="dexHead"><button id="ddBack">‹ 목록</button></div>
    <div class="ddTop"><div class="dn" id="ddName"></div><div class="de" id="ddEn"></div><div class="do" id="ddOne"></div></div>
    <div id="ddCards"></div>
  </div>
</div>
<div id="card" class="hide"><div class="cardBox">
  <div class="ev" id="cEv"></div>
  <div class="pic"><img id="cPic" alt=""></div>
  <div class="co" id="cCo"></div>
  <div class="en" id="cEn"></div>
  <div class="ti" id="cTi"></div>
  <p id="cTx"></p>
  <div class="yr" id="cYr"></div>
  <div class="foot"><span id="cDex"></span><span>탭하면 닫혀요</span></div>
</div></div>
<div id="over" class="hide">
  <div class="big" id="overTitle"></div>
  <div class="score" id="overScore"></div>
  <p id="overText"></p>
  <button id="bRestart">다시 창업</button>
</div>

<script>
// 시제품 수치표 (확정되면 config.js로 옮김)
const M = {
  levelTypes: [2],         // 레벨별 로봇 종류 수 (마지막 값이 이후 레벨에 계속). 3종은 헷갈려서 당분간 2종. ?t= 로 고정
  // 레벨별 난이도 : seed 새 공이 시드로 나올 확률, crisis 재정 위기 한도(적자). 공 크기는 늘 같음.
  // 첫 레벨은 쉽고 갈수록 어려움 (마지막 값이 이후 계속)
  levels: [
    { seed: 0.5,  crisis: 700 },
    { seed: 0.45, crisis: 600 },
    { seed: 0.42, crisis: 500 },
    { seed: 0.4,  crisis: 400 },
    { seed: 0.37, crisis: 300 },
    { seed: 0.35, crisis: 250 }
  ],
  startCash: 100,
  // 단계 : 같은 로봇·같은 단계 공 둘이 부딪히면 한 단계 위(더 큰 공). 유니콘 둘이 합쳐지면 상장(레벨 클리어).
  // r 은 판 폭에 대한 공 반지름 비율
  stages: [
    { name: '창업',    value: 10,   r: 0.059 },
    { name: '시드',    value: 25,   r: 0.074 },
    { name: '시리즈A', value: 60,   r: 0.093 },
    { name: '시리즈B', value: 150,  r: 0.117 },
    { name: '유니콘',  value: 400,  r: 0.146 },   // 지름이 창업의 2.5배
    { name: '상장',    value: 1000, r: 0.17 }
  ],
  ipoMul: 5,               // 상장 대금 = 상장 단계 몸값 × 이 배수
  dumpRate: 0.5,           // 손해 매각 = 몸값의 이 비율
  overflowSec: 1.5,        // 공이 위쪽 선을 이만큼 넘어 있으면 손해 매각
  debtSqueeze: 0.02,       // 적자 100마다 천장(위쪽 선)이 판 높이의 이 비율만큼 내려옴
  debtSqueezeMax: 0.3,     // 천장이 내려오는 최대치 (판 높이 비율)
  fireSaleRate: 0.3,       // 재정 위기 헐값 = 몸값의 이 비율
  dropGap: 0.45,           // 떨어뜨린 뒤 다음 공을 들기까지 (초)
  gravity: 1800,           // 픽셀/초²
  types: [
    { key: 'arm',  name: '협동로봇',   tile: 'robot-cobot', grade: 1.0 },
    { key: 'amr',  name: 'AMR',        tile: 'robot-amr',   grade: 0.8 },
    { key: 'legs', name: '4족보행',    tile: 'robot-quad',  grade: 1.3 },
    { key: 'hum',  name: '휴머노이드', tile: 'tile-hum',    grade: 2.0 }
  ]
};

(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('t')) M.levelTypes = [+qs.get('t')];

  const $ = id => document.getElementById(id);
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const boxEl = $('box');
  const TOP = M.stages.length - 1;

  const S = { balls: [], cash: 0, turn: 0, level: 1, types: [], seen: {}, cur: null, next: null, aimX: 0, ready: true, over: false, cleared: false, crisis: false, dumps: 0, nextId: 1, ipos: 0, firstIpo: 0, minCash: 0, overT: 0 };

  // 판 크기 : 화면 폭을 꽉 채움
  let BW = 360, BH = 480, LINE = 80;
  function layout() {
    BW = Math.min(window.innerWidth, 400) - 16;
    BH = Math.max(320, $('main').clientHeight - 54);   // 아래 종류·안내 한 줄씩
    boxEl.style.width = BW + 'px';
    boxEl.style.height = BH + 'px';
    LINE = 8 + radius(1) * 2 + 10;   // 위쪽 선 : 들고 있는 공(창업·시드) 바로 아래
    paintLine();
  }
  const LV = () => M.levels[Math.min(S.level - 1, M.levels.length - 1)];
  const radius = stage => M.stages[stage].r * BW;
  const valueOf = (stage, type) => Math.round(M.stages[stage].value * type.grade);
  const value = b => valueOf(b.stage, b.type);
  const dumpValue = b => Math.round(value(b) * M.dumpRate);
  const newBall = () => ({ id: S.nextId++, type: S.types[rnd(S.types.length)], stage: Math.random() < LV().seed ? 1 : 0 });

  function artHTML(tile) {
    return `<span class="art bob swap" style="--d:-${(Math.random() * 1.1).toFixed(2)}s">` +
      `<img src="assets/${tile}-a.png" alt=""><img class="b" src="assets/${tile}-b.png" alt=""></span>`;
  }
  function ballEl(b, parent = boxEl) {
    const el = document.createElement('div');
    const r = radius(b.stage);
    el.className = `ball s${b.stage}`;
    el.style.width = el.style.height = r * 2 + 'px';
    // 그림·무늬는 구르는 면에, 이름표는 늘 똑바로
    el.innerHTML = `<span class="face">${artHTML(b.type.tile)}</span><span class="stg" style="font-size:${Math.max(8, r * 0.32)}px">${M.stages[b.stage].name}</span>`;
    el._b = b;
    b.face = el.firstChild;
    parent.appendChild(el);
    b.el = el;
    return el;
  }
  const drawBall = b => { b.el.style.translate = `${b.x - b.r}px ${b.y - b.r}px`; b.face.style.rotate = (b.ang || 0) + 'rad'; };

  // 들고 있는 공
  function aim(x) {
    if (!S.cur) return;
    const r = radius(S.cur.stage);
    S.aimX = Math.max(r + 2, Math.min(BW - r - 2, x));
    S.cur.el.style.translate = `${S.aimX - r}px ${8}px`;
    $('guide').style.left = S.aimX + 'px';
  }
  function spawn() {
    S.cur = S.next || newBall();
    S.next = newBall();
    S.ready = true;
    if (SIM) return;
    ballEl(S.cur).classList.add('held');
    aim(S.aimX || BW / 2);
    const nb = $('nextBall');
    nb.innerHTML = '';
    const mini = document.createElement('div');
    mini.className = `ball s${S.next.stage}`;
    mini.style.cssText = 'position:relative;display:inline-block;width:20px;height:20px;border-width:2px;vertical-align:middle;box-shadow:none';
    mini.innerHTML = artHTML(S.next.type.tile);
    nb.appendChild(mini);
  }

  function drop() {
    if (!S.ready || !S.cur || S.over || S.crisis) return;
    const b = S.cur;
    S.cur = null; S.ready = false;
    b.r = radius(b.stage);
    b.x = S.aimX || BW / 2; b.y = 8 + b.r; b.vx = 0; b.vy = 0; b.born = clock;
    S.balls.push(b);
    const cost = value(b);
    S.cash -= cost;
    S.minCash = Math.min(S.minCash, S.cash);
    S.turn++;
    if (!SIM) { b.el.classList.remove('held'); floatAt(b.x, b.y, '-' + cost, true); paintHUD(); sfx.drop(); }
    setTimeoutSim(() => { if (!S.over) { spawn(); settle(); } }, M.dropGap);
  }

  // 물리 : 중력, 벽, 공끼리 밀어내기. 같은 공이 닿으면 합병.
  let clock = 0;
  const timers = [];
  function setTimeoutSim(fn, sec) { timers.push({ at: clock + sec, fn }); }
  function step(dt) {
    clock += dt;
    for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= clock) { const t = timers.splice(i, 1)[0]; t.fn(); }
    const bs = S.balls;
    for (const b of bs) {
      b.touch = false;
      b.vy += M.gravity * dt;
      b.vx *= 0.995; b.vy *= 0.999;
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    const merges = [];
    for (let it = 0; it < 4; it++) {
      for (const b of bs) {
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.2; }
        if (b.x > BW - b.r) { b.x = BW - b.r; b.vx = -Math.abs(b.vx) * 0.2; }
        if (b.y > BH - b.r) { b.y = BH - b.r; b.vy = -Math.abs(b.vy) * 0.15; b.vx *= 0.92; b.touch = true; }
      }
      for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
        const a = bs[i], c = bs[j];
        if (a.dead || c.dead) continue;
        const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + c.r;
        if (d >= min) continue;
        if (a.type === c.type && a.stage === c.stage) { a.dead = c.dead = true; merges.push([a, c]); continue; }
        a.touch = c.touch = true;
        const nx = dx / d, ny = dy / d, ov = min - d;
        const ma = a.r * a.r, mc = c.r * c.r, tot = ma + mc;
        a.x -= nx * ov * (mc / tot); a.y -= ny * ov * (mc / tot);
        c.x += nx * ov * (ma / tot); c.y += ny * ov * (ma / tot);
        const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (rv < 0) {
          const imp = -(1.15) * rv / (1 / ma + 1 / mc);
          a.vx -= imp * nx / ma; a.vy -= imp * ny / ma;
          c.vx += imp * nx / mc; c.vy += imp * ny / mc;
        }
      }
    }
    // 구르기 : 무언가에 닿아 있으면 미끄러지지 않고 구르는 쪽으로 회전이 맞춰짐
    for (const b of bs) {
      b.w = b.w || 0;
      if (b.touch) b.w += (b.vx / b.r - b.w) * 0.3; else b.w *= 0.995;
      b.ang = (b.ang || 0) + b.w * dt;
    }
    for (const [a, c] of merges) merge(a, c);
    if (merges.length) S.balls = S.balls.filter(b => !b.dead);

    // 넘침 : 떨어진 지 1초 지난 공이 위쪽 선을 넘어 있으면 시간 잼
    const ceil = lineY();
    const high = S.balls.some(b => clock - b.born > 1 && b.y - b.r < ceil && Math.abs(b.vy) < 120);
    S.overT = high ? S.overT + dt : 0;
    if (!SIM) $('line').classList.toggle('warn', S.overT > 0);
    if (S.overT > M.overflowSec && !S.over && !S.crisis) { S.overT = 0; overflowSell(ceil); }
  }

  function merge(a, c) {
    const stage = a.stage + 1;
    const x = (a.x * 1 + c.x) / 2, y = Math.max(a.y, c.y);
    if (!SIM) { a.el.remove(); c.el.remove(); }
    if (stage === TOP) { ipo(a, x, y); return; }
    // 연쇄 : 직전 합병 뒤 0.8초 안에 또 합쳐지면 연쇄, 수입이 연쇄 횟수만큼 배로
    S.chain = clock - S.lastMerge < 0.8 ? S.chain + 1 : 1;
    S.lastMerge = clock;
    const gain = (valueOf(stage, a.type) - 2 * value(a)) * S.chain;
    S.cash += gain;
    const b = { id: S.nextId++, type: a.type, stage, x, y, vx: (a.vx + c.vx) / 2, vy: Math.min(a.vy, c.vy) * 0.5, r: radius(stage), born: clock - 1, ang: a.ang, w: a.w };
    S.balls.push(b);
    if (!SIM) {
      ballEl(b).classList.add('pop');
      drawBall(b);
      floatAt(x, y - b.r * 0.4, '+' + gain + (stage >= TOP - 1 ? ' ' + M.stages[stage].name + '!' : ''));
      shards(x, y, a.stage, 8 + stage * 3);
      sfx.merge(stage, S.chain);
      if (S.chain >= 2) {
        chainText(x, y - b.r, S.chain);
        shake();
        buzz([25, 30, 25 + S.chain * 10]);
      } else buzz(stage >= TOP - 1 ? [40, 40, 80] : 18);
      if (stage === TOP - 1) sfx.unicorn();
      paintHUD();
      // 그 레벨에서 그 로봇이 처음 시리즈B·유니콘이 되면 실제 회사 성장 카드
      const mk = a.type.key + stage;
      if (stage >= 3 && !S.milestones.has(mk)) S.milestones.add(mk);
    }
  }

  function ipo(a, x, y) {
    const v = valueOf(TOP, a.type) * M.ipoMul;
    S.cash += v;
    S.ipos++;
    if (!S.firstIpo) S.firstIpo = S.turn;
    S.over = true; S.cleared = true;
    if (SIM) return;
    floatAt(x, y, '+' + v);
    banner(`${a.type.name} 상장! +${v}`, true);
    shards(x, y, 4, 40);
    shake(); buzz([60, 40, 60, 40, 120]);
    sfx.ipo();
    paintHUD();
    setTimeout(() => queueCard('end', a.type, showClear), 1200);
    const showClear = () => setTimeout(() => {
      $('overTitle').textContent = `레벨 ${S.level} 클리어!`;
      $('overScore').textContent = '+' + v;
      $('overText').innerHTML = `${a.type.name} 회사가 상장했어요 · ${S.turn}턴 · 손해 매각 ${S.dumps}번<br>지갑 ${S.cash} (다음 레벨로 이어져요)`;
      $('bRestart').textContent = `레벨 ${S.level + 1} 시작`;
      $('over').classList.remove('hide');
    }, 200);
  }

  // 빚 천장 : 적자일수록 위쪽 선이 내려옴
  const squeeze = () => S.cash >= 0 ? 0 : Math.min(M.debtSqueezeMax, -S.cash / 100 * M.debtSqueeze) * BH;
  const lineY = () => LINE + squeeze();
  function paintLine() {
    if (SIM) return;
    $('line').style.top = lineY() + 'px';
    $('lineTxt').textContent = S.cash < 0 ? `적자 ${S.cash} / 재정 위기 -${LV().crisis}` : '';
  }

  function settle() {
    paintHUD();
    if (S.cash < -LV().crisis && !S.over && !S.crisis) fireSale();
  }

  // 공 하나를 팖 (rate : 몸값 대비 받는 비율)
  function sellBall(b, rate, label) {
    const v = Math.round(value(b) * rate);
    S.cash += v;
    S.dumps++;
    S.balls = S.balls.filter(o => o !== b);
    if (!SIM) { floatAt(b.x, b.y, `+${v} ${label}`); b.el.remove(); shards(b.x, b.y, b.stage, 12); sfx.sell(); paintHUD(); }
  }

  // 위기 : 잠시 멈추고, 고른 순서대로 공이 하나씩 빛나며 팔려 나감. 끝나면 위기 카드 뒤 이어서.
  //   pickNext() : 다음에 팔 공 (없으면 null = 끝), rate·label : 받는 비율과 꼬리표
  function crisisFlow(title, pickNext, rate, label) {
    S.crisis = true;
    S.crises = (S.crises || 0) + 1;
    if (SIM) {
      for (let b = pickNext(); b; b = pickNext()) sellBall(b, rate, label);
      S.crisis = false;
      return;
    }
    S.paused = true;
    shake(); buzz([120, 60, 120]); sfx.crisis();
    banner(title, 'crisis');
    const next = () => {
      const b = pickNext();
      if (!b) {
        setTimeout(() => queueCard('crisis', S.types[rnd(S.types.length)], () => { S.crisis = false; S.paused = false; S.overT = 0; paintHUD(); }), 500);
        return;
      }
      b.el.classList.add('firesale');
      setTimeout(() => { sellBall(b, rate, label); setTimeout(next, 260); }, 450);
    };
    setTimeout(next, 900);
  }

  // 자리 위기 : 선을 넘은 공 중 가장 싼 공부터 반값에, 선 아래로 정리될 때까지
  function overflowSell(ceil) {
    crisisFlow('자리 위기! 넘친 회사를 반값에 팝니다', () => {
      const over = S.balls.filter(b => b.y - b.r < ceil).sort((a, b) => value(a) - value(b));
      return over[0] || null;
    }, M.dumpRate, '넘침');
  }

  // 재정 위기 : 몸값 높은 공부터 헐값에, 지갑이 0 이상이 될 때까지
  function fireSale() {
    crisisFlow('재정 위기! 핵심 자산을 헐값에 팝니다', () => {
      if (S.cash >= 0) return null;
      return S.balls.slice().sort((a, b) => value(b) - value(a))[0] || null;
    }, M.fireSaleRate, '헐값');
  }

  const boardValue = () => S.balls.reduce((v, b) => v + value(b), 0);
  function paintHUD() {
    if (SIM) return;
    $('sLevel').textContent = S.level;
    $('sTurn').textContent = S.turn;
    $('sCash').textContent = S.cash;
    $('sCashBox').classList.toggle('red', S.cash < 0);
    paintLine();
    $('sBoard').textContent = boardValue();
  }
  function floatAt(x, y, text, minus) {
    const f = document.createElement('div');
    f.className = 'float';
    if (minus) f.style.color = '#FF8A80';
    f.textContent = text;
    f.style.left = x + 'px'; f.style.top = y + 'px';
    boxEl.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }
  let bannerT = 0;
  function banner(text, ipoStyle) {
    if (SIM) return;
    const b = $('banner');
    b.textContent = text;
    b.classList.toggle('ipo', ipoStyle === true);
    b.classList.toggle('crisis', ipoStyle === 'crisis');
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    clearTimeout(bannerT);
    bannerT = setTimeout(() => b.classList.remove('show'), 1900);
  }

  let SIM = false;
  function newGame(sim) {
    SIM = !!sim;
    S.cash = M.startCash; S.level = 1; S.ipos = 0; S.firstIpo = 0; S.minCash = M.startCash;
    S.seen = Object.fromEntries(M.types.map(t => [t.key, 0]));
    startLevel();
  }
  function startLevel() {
    for (const b of S.balls) if (b.el) b.el.remove();
    if (S.cur && S.cur.el) S.cur.el.remove();
    S.balls = []; timers.length = 0;
    S.turn = 0; S.over = false; S.cleared = false; S.dumps = 0; S.crisis = false; S.crises = 0; S.overT = 0;
    S.chain = 0; S.lastMerge = -9; S.milestones = new Set(); S.crashed = false; S.crashCard = false; S.paused = false;
    S.cur = null; S.next = null;
    {
      const k = M.levelTypes[Math.min(S.level - 1, M.levelTypes.length - 1)];
      S.types = shuffle([...M.types]).sort((a, b) => S.seen[a.key] - S.seen[b.key]).slice(0, k);
      for (const t of S.types) S.seen[t.key]++;
    }
    if (!SIM) {
      layout();
      S.aimX = BW / 2;
      $('bRestart').textContent = '다시 창업';
      $('legendTypes').innerHTML = S.types.map(t => `<span><img src="assets/${t.tile}-a.png" alt="">${t.name} ×${t.grade}</span>`).join('');
      $('over').classList.add('hide');
    }
    spawn();
    paintHUD();
    if (!SIM) setTimeout(() => queueCard('start', S.types[rnd(S.types.length)]), 300);
  }

  // ---------- 연출 ----------
  const INK = ['#F5B700', '#F57A1F', '#F0426E', '#7B4DF0', '#C9A2FF'];
  function shards(x, y, stage, n) {
    if (SIM) return;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'shard';
      const ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 50;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.background = i % 3 ? INK[stage] : '#FFFFFF';
      if (stage === 4) el.style.background = ['#FFB3E6', '#C9A2FF', '#7FD8FF', '#FFE27A'][i % 4];
      el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(ang) * dist - 20 + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      boxEl.appendChild(el);
      setTimeout(() => el.remove(), 650);
    }
  }
  function chainText(x, y, n) {
    const el = document.createElement('div');
    el.className = 'chain';
    el.textContent = n + '연쇄!';
    el.style.fontSize = Math.min(44, 24 + n * 5) + 'px';
    el.style.left = Math.max(60, Math.min(BW - 60, x)) + 'px';
    el.style.top = Math.max(40, y) + 'px';
    boxEl.appendChild(el);
    setTimeout(() => el.remove(), 1050);
  }
  function shake() { boxEl.classList.remove('shake'); void boxEl.offsetWidth; boxEl.classList.add('shake'); }
  const buzz = p => { if (!SIM && navigator.vibrate) navigator.vibrate(p); };

  // ---------- 소리 : 파일 없이 브라우저에서 만듦 ----------
  const sfx = (() => {
    let ac = null;
    const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; };
    function tone(f, dur, type = 'sine', vol = 0.2, f2 = null, delay = 0) {
      const a = ctx(); if (!a || SIM) return;
      const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    const NOTE = [523, 587, 659, 784, 880, 1047];
    return {
      unlock: ctx,
      drop: () => tone(900, 0.05, 'triangle', 0.12, 500),
      merge: (stage, chain) => { const f = NOTE[stage] * (1 + 0.06 * (chain - 1)); tone(f * 0.5, 0.09, 'sine', 0.25, f); tone(f, 0.18, 'triangle', 0.14, null, 0.05); },
      unicorn: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, null, 0.08 * i)),
      ipo: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.6 : 0.18, 'square', 0.08, null, 0.12 * i)),
      sell: () => tone(400, 0.15, 'sawtooth', 0.07, 200),
      crisis: () => [392, 330, 262, 196].forEach((f, i) => tone(f, i === 3 ? 0.7 : 0.22, 'sawtooth', 0.09, null, 0.18 * i)),
      card: () => tone(1320, 0.12, 'sine', 0.1, 1760)
    };
  })();

  // ---------- 실제 회사 카드 (data/cards.json에 있는 것만) ----------
  const DATA = { cards: [], companies: {} };
  const ROBOT_GROUP = { arm: 'cobot', amr: 'service', legs: 'quadruped', hum: 'humanoid' };   // AMR은 서비스로봇 묶음
  const EVENT_NAME = { found: '창업', grow: '성장', market: '시장', steal: '빼앗김', merge: '합병', sell: '매각', ipo: '상장', crash: '재정 위기', close: '사업 정리', regulate: '규제' };
  // 게임 순간마다 쓰는 카드 묶음 : 175장이 다 나오게
  const MOMENT = {
    start: ['found', 'market', 'regulate'],              // 레벨 시작
    sell: ['sell', 'merge', 'steal'],     // (예비) 매각
    end: ['ipo', 'grow'],                 // 레벨 끝 : 상장
    crisis: ['crash', 'close']            // 재정 위기
  };
  const GROUP = {
    cobot: { name: '협동로봇', icon: 'robot-cobot' },
    quadruped: { name: '4족보행', icon: 'robot-quad' },
    humanoid: { name: '휴머노이드', icon: 'tile-hum' },
    service: { name: '서비스로봇·AMR', icon: 'robot-amr' },
    parts: { name: '부품·SW', icon: 'tile-tool' },
    industrial: { name: '산업용 로봇', icon: 'tile-iarm' }
  };
  const used = new Set();
  // 도감 : 받은 카드 id 목록을 휴대폰에 저장
  const loadGot = () => { try { return new Set(JSON.parse(localStorage.getItem('rdc.cards') || '[]')); } catch (e) { return new Set(); } };
  const saveGot = d => { try { localStorage.setItem('rdc.cards', JSON.stringify([...d])); } catch (e) {} };
  const companyOf = card => DATA.companies[card.company] || {};
  Promise.all([fetch('data/cards.json').then(r => r.json()), fetch('data/companies.json').then(r => r.json())])
    .then(([cards, cos]) => { DATA.cards = cards; for (const c of cos) DATA.companies[c.id] = c; if (cardQueue.length) showCard(); })
    .catch(() => { DATA.failed = true; while (cardQueue.length) { const q = cardQueue.shift(); if (q.after) q.after(); } });
  // 같은 로봇 종류 회사 카드 중 아직 안 본 것 > 다른 종류 회사 카드 > 다 봤으면 처음부터
  function pickCard(moment, type) {
    const group = ROBOT_GROUP[type.key], kinds = MOMENT[moment];
    const of = c => kinds.includes(c.type) && !used.has(c.id);
    let pool = DATA.cards.filter(c => of(c) && companyOf(c).type === group);
    if (!pool.length) pool = DATA.cards.filter(of);
    if (!pool.length) { for (const c of DATA.cards) if (kinds.includes(c.type)) used.delete(c.id); pool = DATA.cards.filter(of); }
    const card = pool[rnd(pool.length)];
    if (card) used.add(card.id);
    return card;
  }
  const cardQueue = [];
  function queueCard(event, type, after) {
    if (SIM || DATA.failed) { if (after) after(); return; }
    cardQueue.push({ event, type, after });
    if (cardQueue.length === 1 && DATA.cards.length) showCard();
  }
  function showCard() {
    const q = cardQueue[0];
    if (!q) return;
    const card = pickCard(q.event, q.type);
    if (!card) { cardQueue.shift(); if (q.after) q.after(); showCard(); return; }
    const co = companyOf(card);
    const got = loadGot(); const isNew = !got.has(card.id); got.add(card.id); saveGot(got);
    fillCard(card);
    const coGot = new Set([...got].map(id => (DATA.cards.find(c => c.id === id) || {}).company));
    $('cDex').textContent = `${isNew ? '새 카드! ' : ''}도감 ${coGot.size}/${Object.keys(DATA.companies).length}개사 · ${got.size}/${DATA.cards.length}장`;
    S.paused = true;
    $('card').classList.remove('hide');
    sfx.card();
  }
  function fillCard(card) {
    const co = companyOf(card);
    $('cEv').textContent = EVENT_NAME[card.type] || card.type;
    $('cPic').src = `assets/${(GROUP[co.type] || GROUP.service).icon}-a.png`;
    $('cCo').textContent = co.name || '';
    $('cEn').textContent = [co.en, co.country].filter(Boolean).join(' · ');
    $('cTi').textContent = card.title || '';
    $('cTx').textContent = card.text;
    $('cYr').textContent = card.year;
  }
  $('card').addEventListener('click', () => {
    if (dexCard) { dexCard = false; $('card').classList.add('hide'); return; }   // 도감에서 다시 보던 카드
    const q = cardQueue.shift();
    $('card').classList.add('hide');
    S.paused = cardQueue.length > 0;
    if (q && q.after) q.after();
    showCard();
  });

  // ---------- 도감 : 40개사, 받은 카드 다시 보기 ----------
  let dexCard = false;
  function openDex() {
    if (!DATA.cards.length) { banner('카드를 불러오는 중이에요'); return; }
    S.paused = true;
    const got = loadGot();
    const cos = Object.values(DATA.companies);
    const cardsOf = id => DATA.cards.filter(c => c.company === id);
    const coGot = cos.filter(co => cardsOf(co.id).some(c => got.has(c.id))).length;
    $('dexSum').textContent = `${coGot}/${cos.length}개사 · 카드 ${got.size}/${DATA.cards.length}장`;
    $('dexList').innerHTML = Object.entries(GROUP).map(([g, info]) => {
      const list = cos.filter(co => co.type === g);
      return `<div class="grp"><div class="gh"><img src="assets/${info.icon}-a.png" alt="">${info.name}</div>` +
        list.map(co => {
          const all = cardsOf(co.id), n = all.filter(c => got.has(c.id)).length;
          return `<button class="co ${n ? '' : 'locked'}" data-id="${co.id}">` +
            `<b>${n ? co.name : '???'}</b><span>${n ? co.country : '아직 못 만났어요'}</span><i>${n}/${all.length}</i></button>`;
        }).join('') + '</div>';
    }).join('');
    $('dexDetail').classList.add('hide');
    $('dex').classList.remove('hide');
  }
  function openCompany(id) {
    const co = DATA.companies[id], got = loadGot();
    const all = DATA.cards.filter(c => c.company === id);
    if (!all.some(c => got.has(c.id))) { banner('카드를 받으면 열려요'); return; }
    $('ddName').textContent = co.name;
    $('ddEn').textContent = `${co.en} · ${co.country}`;
    $('ddOne').textContent = co.oneLine;
    $('ddCards').innerHTML = all.map(c => got.has(c.id)
      ? `<button class="dc" data-card="${c.id}"><em>${EVENT_NAME[c.type] || c.type}</em><b>${c.title || ''}</b><span>${c.year}</span></button>`
      : `<div class="dc locked"><em>?</em><b>아직 못 받은 카드</b><span></span></div>`).join('');
    $('dexDetail').classList.remove('hide');
  }
  $('bDex').addEventListener('click', openDex);
  $('dexClose').addEventListener('click', () => { $('dex').classList.add('hide'); S.paused = false; });
  $('ddBack').addEventListener('click', () => $('dexDetail').classList.add('hide'));
  $('dexList').addEventListener('click', e => { const b = e.target.closest('.co'); if (b) openCompany(b.dataset.id); });
  $('ddCards').addEventListener('click', e => {
    const b = e.target.closest('.dc[data-card]');
    if (!b) return;
    dexCard = true;
    fillCard(DATA.cards.find(c => c.id === b.dataset.card));
    $('cDex').textContent = '도감에서 다시 보기';
    $('card').classList.remove('hide');
  });

  // 화면 갱신
  let last = 0;
  function frame(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0.016);
    last = t;
    if (!SIM && !S.paused) {
      // 작은 걸음으로 나눠 안정적으로
      for (let k = 0; k < 2; k++) step(dt / 2);
      for (const b of S.balls) if (b.el) drawBall(b);
    }
    requestAnimationFrame(frame);
  }

  // 입력 : 손가락 좌우 → 겨누기, 떼면 떨어뜨림. 매각 고르기 중에는 공을 짧게 누름.
  let touch = null;
  const localX = e => e.clientX - boxEl.getBoundingClientRect().left;
  boxEl.addEventListener('pointerdown', e => {
    sfx.unlock();
    if (S.over || S.paused) return;
    e.preventDefault();
    touch = { x: e.clientX, y: e.clientY, id: e.pointerId };
    boxEl.setPointerCapture(e.pointerId);
    aim(localX(e));
  });
  boxEl.addEventListener('pointermove', e => {
    if (!touch || e.pointerId !== touch.id) return;
    aim(localX(e));
  });
  boxEl.addEventListener('pointerup', e => {
    if (!touch || e.pointerId !== touch.id) return;
    touch = null;
    drop();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') aim(S.aimX - 20);
    else if (e.key === 'ArrowRight') aim(S.aimX + 20);
    else if (e.key === 'ArrowDown' || e.key === ' ') drop();
  });

  $('bNew').addEventListener('click', () => { if ((S.turn === 0 && S.level === 1) || confirm('레벨 1부터 새로 시작할까요?')) newGame(); });
  $('bRestart').addEventListener('click', () => {
    $('overScore').style.color = '';
    if (S.cleared) { S.level++; startLevel(); }
    else newGame();
  });

  // 시험용 : 자리 위기를 바로 일으킴 (선 높이를 판 높이 비율 y로)
  window.testOverflow = y => overflowSell(BH * y);

  // 시험용 봇 : 같은 공 위나 빈 곳을 노려 떨어뜨림, 화면 없이 물리만 돌림. window.simulate(판 수, 최대 턴)
  window.simulate = (games, maxTurns = 400, skill = 0.8, level = 1) => {
    const out = [];
    for (let g = 0; g < games; g++) {
      newGame(true);
      if (level > 1) { S.level = level; startLevel(); }
      let guard = 0;
      while (!S.over && S.turn < maxTurns && guard++ < 400000) {
        if (S.ready && S.cur) {
          const same = S.balls.filter(b => b.type === S.cur.type && b.stage === S.cur.stage).sort((a, b) => (a.y - a.r) - (b.y - b.r));
          const r = radius(S.cur.stage);
          S.aimX = same.length && Math.random() < skill ? same[0].x + (Math.random() - 0.5) * r : r + Math.random() * (BW - 2 * r);
          S.aimX = Math.max(r + 2, Math.min(BW - r - 2, S.aimX));
          drop();
        }
        step(1 / 120);
      }
      out.push({ firstIpo: S.firstIpo, dumps: S.dumps, turn: S.turn, minCash: S.minCash, crises: S.crises || 0 });
    }
    newGame();
    return out;
  };

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
